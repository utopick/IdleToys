       * new LOFI.Player(ctx, destination, sheet, start, fadeIn, nf) plays one sheet through Web Audio; the caller

       *   or all false) a song plays its plain score, which a test pins with a fingerprint.
       * The first drum loop, its bass rhythm and the chord hits are TUNE.Pocket's JAM "Lo-fi" loop (lazy beat).
       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of
       *   its leads, another one plays the solo section) and the bass, which drum kit plays the loop (KITS maps
       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in
       *   band, voices, drums, hits and echo, so the Player only follows the sheet.
       * Each song grows from a gene of three moves between scale degrees (sheet.motif). The moves walk the
       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.

       *   ending, and every song has a four-bar solo. Some songs add a ticking clock (CLICKS) under the drums.
       * To add a band, add a row to BANDS and, if it needs a new sound, write that voice as a Player method

       *   render a song with it and set its level so it sounds about as loud as the others; the test checks
       *   that every band turns up and that every voice it names exists.

       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a
       *   place's style in OWN_REGIONS and REGIONS. Without a style the dice are thrown exactly as before, so a
       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";

          let a = seed >>> 0;

            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",
            style = STYLES[styleName],
            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],
            mode = MODES[modeName];
          const minorRoll = r() < 0.25 + 0.5 * night,
            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));
          const motif = [pick(MOVES), pick(MOVES), pick(MOVES)];
          let colourName = pick(Object.keys(COLOURS)),
            colour = COLOURS[colourName];
          if (style?.colour)
            [colourName, colour] = Array.isArray(style.colour)
              ? ["own", style.colour]

// ---------- cities ----------
const CITIES = [
  ["Madrid", 40.42, -3.70], ["London", 51.51, -0.13], ["Reykjavik", 64.15, -21.94], ["Kyoto", 35.01, 135.77],
  ["New York", 40.71, -74.0], ["Buenos Aires", -34.6, -58.38], ["Cairo", 30.04, 31.24], ["Prague", 50.08, 14.43],
];

// ---------- the world ----------
const TOWN_TYPES = ["townhall", "granary", "forge", "tavern", "bakery", "chapel", "vault", "home", "home", "tavern", "home"];
const UP_TYPES = ["home", "home", "tavern", "chapel", "vault", "bakery", "forge"];
const LEVEL_THEMES = [["cellar", "mine"], ["fungus", "fungus2"], ["grotto", "grotto2"], ["crypt", "crypt2", "cells"], ["shrine", "cells", "mine"]];
const WORKERS = [["goblin0", "Goblin", "Goblin"], ["goblin1", "Hobgoblin", "Hobgoblin"], ["kobold", "Kobold", "Kóbold"]];
const LURKERS = [["skeleton", "Skeleton", "Esqueleto"], ["ghoul", "Ghoul", "Necrófago"]];
const BEASTS = [["rat", "Giant Rat", "Rata gigante"], ["bat", "Giant Bat", "Murciélago gigante"], ["slime", "Gray Ooze", "Cieno gris"], ["spider", "Giant Spider", "Araña gigante"]];
const SYL = ["al", "bra", "cor", "dun", "el", "fen", "gar", "hil", "is", "jor", "ka", "lin", "mor", "na", "os", "pel", "quin", "ros", "sel", "tor", "ul", "vin", "wen", "yra", "zu"];
const GSYL = ["gr", "sn", "kr", "zag", "ub", "nik", "rot", "gob", "uz", "ik", "mog", "rat"];
const nameOf = (monster) => { const s = monster ? GSYL : SYL; const n = 2 + (R() < 0.4); let w = ""; for (let i = 0; i < n; i++) w += pick(s); return w[0].toUpperCase() + w.slice(1); };

function newWorld(city) {
  const seed = (R() * 1e9) >>> 0, r = rng(seed);

  for (let c = 0; c < NC; c++) if (r() < 0.6) cols[c].rooms.push(pick(UP_TYPES, r));

    food: 40, gold: 12, hoard: 60, mush: 30,
    cast: { worker: pick(WORKERS, r), lurker: pick(LURKERS, r), beast: pick(BEASTS, r) },
    riverDown: r() < 0.5, age: 1, phase: "boom", lows: 0, graves: [], chron: [], lastNudge: 0, saved: Date.now(), wakeAt: 0,

let lost = store.get("dungeontown.r4.lost", []);
let w = store.get(KEY, null);
if (!w || w.v !== 1 || !Array.isArray(w.cols) || !Array.isArray(w.levels)) w = null;

const say = (en, es) => { if (!w) return; w.chron.push({ t: Date.now(), en, es }); if (w.chron.length > 60) w.chron.shift(); };

// ---------- clock, light, weather ----------
let tzOff = null, wx = Q.get("weather") || "clear", wxCode = 0;
function hourNow() {

  const d = new Date();
  if (tzOff != null) { const u = d.getTime() + tzOff * 1000; const z = new Date(u); return z.getUTCHours() + z.getUTCMinutes() / 60; }
  return d.getHours() + d.getMinutes() / 60;
}
function daylight(h) { return Math.max(0, Math.min(1, Math.sin(((h - 5.5) / 14.5) * Math.PI) * 1.6)); }
async function fetchWeather() {
  if (Q.get("weather") || !w) return;
  const c = CITIES.find((x) => x[0] === w.city) || CITIES[0], k = "dungeontown.r4.wx:" + c[0];
  let d = store.get(k, null);

    try {
      const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[1]}&longitude=${c[2]}&current=weather_code&timezone=auto`)).json();
      if (j && j.current && Number.isFinite(j.current.weather_code)) { d = { at: Date.now(), code: j.current.weather_code, off: Number(j.utc_offset_seconds) || 0 }; store.set(k, d); }
    } catch { /* offline: the device clock and clear skies */ }
  }

    wx = [71, 73, 75, 77, 85, 86].includes(wxCode) ? "snow" : wxCode >= 51 ? (wxCode >= 95 ? "storm" : "rain") : wxCode >= 45 ? "fog" : wxCode >= 2 ? "cloud" : "clear";
  }
}
let forcedRain = 0;
const raining = () => forcedRain > Date.now() || wx === "rain" || wx === "storm";

// ---------- geometry ----------
let G = 0, Gt = 0;
const townH = () => Math.max(...w.cols.map((c) => c.rooms.length + (c.build ? 1 : 0)));
const maxRows = () => Math.floor((H - 30) / RH);
function groundTarget() { const t = townH() + 1, d = w.levels.length; return Math.round((H + RH * t - RH * d) / 2); }
const colX = (c) => MARGIN + c * RW;
const floorY = (lvl) => G - RH * lvl - 4;
const shaftX = () => W - MARGIN / 2;
const levelLeft = (j) => W - MARGIN - w.levels[j].n * RW;

// ---------- beings ----------
let beings = [], fx = [], follow = null;
function mk(o) { const b = { x: shaftX(), lvl: 0, path: [], t: R() * 10, icon: null, iconT: 0, face: 1, wait: 0, carry: null, name: nameOf(o.side === "d"), hunger: R() * 40, mood: 60, born: Date.now(), story: [], ...o }; beings.push(b); return b; }
function populate() {
  beings = [];
  const folk = ["folk0", "folk1", "folk2", "folk3", "folk4", "folk5"];
  w.cols.forEach((c, ci) => c.rooms.forEach((t, k) => {
    const sp = t === "forge" ? "smith" : t === "bakery" ? "baker" : t === "chapel" ? "priest" : pick(folk);
    mk({ side: "t", sp, x: colX(ci) + 20 + R() * 56, lvl: k, home: ci, job: "folk" });
  }));
  for (let i = 0; i < 3; i++) mk({ side: "t", sp: pick(["cat", "dog", "chicken", "chicken"]), x: colX((R() * NC) | 0) + 30, lvl: 0, job: "animal" });
  w.levels.forEach((L, j) => { for (let i = 0; i < Math.max(1, L.n - 1); i++) spawnMonster(j); });
}
function spawnMonster(j) {
  const L = w.levels[j]; if (!L) return;
  const th = LEVEL_THEMES[L.theme][0];
  const role = th === "crypt" || th === "shrine" ? "lurker" : th === "grotto" ? "beast" : j === 0 ? "worker" : R() < 0.6 ? "worker" : "beast";
  const sp = w.cast[role][0];
  return mk({ side: "d", sp, role, x: levelLeft(j) + 10 + R() * (L.n * RW - 20), lvl: -(j + 1), job: role });
}
function goTo(b, x, lvl) {

  b.path.push({ x });
}
// a floor is reachable from the outside ladder (right edge) when every house between has that floor
const reachable = (ci, k) => w.cols.slice(ci).every((c) => c.rooms.length > k);
function emote(b, ico, s = 3) { b.icon = "ico_" + ico; b.iconT = s; }
function walkRange(b) {
  const l = Math.round(b.lvl);
  if (l >= 0) { const ci = Math.max(0, Math.min(NC - 1, Math.floor((b.x - MARGIN) / RW))); let a = ci, z = ci; while (a > 0 && w.cols[a - 1].rooms.length > l) a--; while (z < NC - 1 && w.cols[z + 1].rooms.length > l) z++; return [colX(a) + 8, colX(z) + RW - 8]; }
  const j = -l - 1; if (!w.levels[j]) return [shaftX(), shaftX()]; return [levelLeft(j) + 8, W - MARGIN - 8];
}

// raids and delves: the gold-for-food loop
function sendDelvers(n, why) {
  for (let i = 0; i < n; i++) {
    const deep = Math.max(1, w.levels.length - (R() < 0.5 ? 0 : 1));
    const b = mk({ side: "t", sp: pick(["delver0", "delver1", "delver2"]), x: colX(NC - 1) + 40 - i * 8, lvl: 0, job: "delve", target: -deep, hp: 2 + (R() * 3) | 0 });
    b.wait = i * 0.8; b.story.push(T("set out to delve", "bajó a la mazmorra"));
    goTo(b, levelLeft(deep - 1) + 20 + R() * 40, -deep); emote(b, "gold");
  }
  if (why) say(`${n} delvers went down for gold.`, `${n} aventureros bajaron por oro.`);
}
function sendRaid(n, why) {
  const top = w.cols.findIndex((c) => c.rooms[0] === "granary");
  for (let i = 0; i < n; i++) {
    const b = mk({ side: "d", sp: w.cast.worker[0], role: "worker", x: W - MARGIN - 10, lvl: -1, job: "raid" });
    b.wait = i * 0.7; goTo(b, colX(Math.max(0, top)) + 30 + R() * 30, 0); emote(b, "hungry");
  }
  if (why) say(`The ${w.cast.worker[1].toLowerCase()}s climbed up for food.`, `Los ${w.cast.worker[2].toLowerCase()}s subieron a por comida.`);
}

function die(b, en, es) {
  b.dead = true;
  if (b.side === "t" && b.job === "delve") {
    w.graves.push({ name: b.name, at: Date.now() }); if (w.graves.length > 40) w.graves.shift();
    say(`${b.name} fell ${en}. A grave was dug.`, `${b.name} cayó ${es}. Se cavó una tumba.`);
  } else fx.push({ k: "bone", x: b.x, lvl: b.lvl, t: 40 });
  if (follow === b) { showCard(b.name, T(`Fallen ${en}.`, `Caído ${es}.`)); follow = null; }
}

function stepBeing(b, dt) {
  b.t += dt; if (b.iconT > 0) b.iconT -= dt; else b.icon = null;
  if (b.wait > 0) { b.wait -= dt; return; }
  const sp = b.job === "animal" ? 10 : b.side === "d" ? 14 : 12;
  const p = b.path[0];
  if (p) {
    if (p.x != null) { const d = p.x - b.x; b.face = d >= 0 ? 1 : -1; if (Math.abs(d) < sp * dt) { b.x = p.x; b.path.shift(); } else b.x += Math.sign(d) * sp * dt; }
    else { const d = p.lvl - b.lvl, v = 0.35 * dt; b.climb = true; if (Math.abs(d) < v) { b.lvl = p.lvl; b.path.shift(); b.climb = false; } else b.lvl += Math.sign(d) * v; }
    b.moving = true; return;
  }
  b.moving = false;
  // arrived
  if (b.job === "delve") {
    if (b.carry) { // home with gold
      w.gold += b.carry === "coin" ? 4 : 0; b.carry = null; b.job = "folk"; emote(b, "happy"); b.story.push(T("came home with gold", "volvió con oro"));
      b.dead = true; return; // goes home into the crowd
    }
    const danger = 0.18 + w.levels.length * 0.04 + (w.wakeAt > Date.now() ? 0.5 : 0);
    if (R() < danger || b.doomed) { emote(b, "fear", 2); b.wait = 1.4; b.job = "dying"; return; }
    if (w.hoard > 3) { w.hoard -= 4; b.carry = "coin"; emote(b, "gold"); b.story.push(T("found gold", "encontró oro")); }
    else emote(b, "sad");
    goTo(b, colX(w.cols.findIndex((c) => c.rooms[0] === "vault") >= 0 ? w.cols.findIndex((c) => c.rooms[0] === "vault") : 0) + 48, 0);
    return;
  }
  if (b.job === "dying") { die(b, T("in the deep", "en las profundidades"), ""); return; }
  if (b.job === "raid") {
    if (b.carry) { w.mush += 5; b.carry = null; b.job = "worker"; emote(b, "happy"); return; }
    if (R() < 0.15) { emote(b, "angry", 2); die(b, "", ""); say(`The guards slew a ${w.cast.worker[1].toLowerCase()}.`, `La guardia mató a un ${w.cast.worker[2].toLowerCase()}.`); return; }
    if (w.food > 3) { w.food -= 4; b.carry = "sack"; emote(b, "love"); } else emote(b, "sad");

    if (reachable(ci, k) && reachable(here, Math.round(b.lvl))) { goTo(b, colX(ci) + 16 + R() * 64, k); return; }
  }
  b.path = [{ x: a + R() * (z - a) }];
  if (R() < 0.15) emote(b, b.side === "d" ? (w.mush < 10 ? "hungry" : "sleep") : w.food < 10 ? "hungry" : w.gold > 30 ? "gold" : "happy", 2);
}

// ---------- growth and the cycle (pure numbers, also used by the catch-up) ----------
function simTick(dt, quiet) {
  const townRooms = w.cols.reduce((s, c) => s + c.rooms.length, 0);
  const fungus = w.levels.filter((L) => LEVEL_THEMES[L.theme][0] === "fungus").reduce((s, L) => s + L.n, 0) + 1;
  const season = 1 + 0.3 * Math.sin((new Date().getMonth() / 12) * Math.PI * 2);
  w.food += dt * (0.05 * w.cols.length * season * (raining() ? 1.4 : 1) - 0.012 * townRooms);
  w.mush += dt * (0.025 * fungus - 0.008 * w.levels.reduce((s, L) => s + L.n, 0));
  w.hoard += dt * 0.012 * w.levels.length;
  w.gold -= dt * (w.gold > 40 ? 0.03 * townRooms * 0.2 : 0); // decadence: gold spent on finery
  w.food = Math.max(0, Math.min(120, w.food)); w.mush = Math.max(0, Math.min(120, w.mush)); w.hoard = Math.max(0, w.hoard); w.gold = Math.max(0, w.gold);
  // building, room by room
  const room = maxRows();
  for (const c of w.cols) if (c.build) { c.build -= dt; if (c.build <= 0) { c.build = 0; c.rooms.push(c.next); if (!quiet) { const ci = w.cols.indexOf(c), k = c.rooms.length - 1, b = mk({ side: "t", sp: pick(["folk0", "folk1", "folk2", "folk3"]), x: reachable(ci, k) ? shaftX() : colX(ci) + 48, lvl: reachable(ci, k) ? 0 : k, job: "folk" }); if (reachable(ci, k)) goTo(b, colX(ci) + 48, k); emote(b, "happy"); } say(`A new ${c.next} rose in the town.`, `Se alzó un nuevo piso en el pueblo.`); } }
  for (const L of w.levels) if (L.dig) { L.dig -= dt; if (L.dig <= 0) { L.dig = 0; L.n++; if (!quiet) spawnMonster(w.levels.indexOf(L)); } }
  const busy = w.cols.some((c) => c.build) || w.levels.some((L) => L.dig);
  const rows = townH() + 1 + w.levels.length;
  if (!busy && w.gold >= 8 && w.food >= 25) {
    const cands = w.cols.map((c, i) => [c.rooms.length + R(), i]).sort((a, b) => a[0] - b[0]);
    const ci = cands[0][1], c = w.cols[ci];
    if (c.rooms.length < townH() || rows < room) { c.build = quiet ? 0.01 : 18; c.next = pick(UP_TYPES); w.gold -= 8; w.food -= 6; }
  } else if (!busy && w.mush >= 22) {
    const last = w.levels[w.levels.length - 1];
    if (last.n < NC) { last.dig = quiet ? 0.01 : 16; w.mush -= 10; }
    else if (rows < room) { const j = w.levels.length; w.levels.push({ n: 0, theme: w.themes[j % w.themes.length], dig: quiet ? 0.01 : 16 }); w.mush -= 12; say("The monsters dug a new level.", "Los monstruos cavaron un nivel nuevo."); }
  }
  // falls: hunger empties the top rooms, starving monsters abandon a cave
  if (w.food <= 0.5 && R() < dt * 0.02) {
    const c = w.cols.reduce((a, b) => (b.rooms.length > a.rooms.length ? b : a));
    if (c.rooms.length > 1) { c.rooms.pop(); w.phase = "collapse"; w.food += 10; say("Famine: a house was left to ruin.", "Hambruna: una casa quedó en ruinas."); fx.push({ k: "dust", x: colX(w.cols.indexOf(c)) + 48, lvl: c.rooms.length, t: 3 }); }
  }
  if (w.mush <= 0.5 && R() < dt * 0.02) {
    const L = w.levels[w.levels.length - 1];
    if (w.levels.length > 2 || L.n > 1) { if (L.n > 1) L.n--; else w.levels.pop(); w.mush += 12; say("A starving cave was abandoned to the rock.", "Una cueva hambrienta volvió a ser roca."); }
  }
  w.phase = w.food < 12 || w.gold < 3 ? "collapse" : w.food > 60 ? "boom" : w.phase === "collapse" ? "rebuild" : w.phase;
  // ages: the town falls to its bones, then rebuilds; after the seventh fall it is gone
  const tr = w.cols.reduce((s, c) => s + c.rooms.length, 0);
  if (tr <= NC && w.food < 5) { if (!w.low) { w.low = true; w.age++; say(`The ${ordinal(w.age)} age began in hardship.`, `Comenzó la era ${w.age}, en la miseria.`); if (w.age >= 7) w.ended = true; } } else if (tr > NC + 2) w.low = false;
}
const ordinal = (n) => n + (["th", "st", "nd", "rd"][n % 10 > 3 || ((n / 10) | 0) === 1 ? 0 : n % 10] || "th");

// AI pressure: hunger drives raids, greed drives delves
let pressT = 0;
function pressures(dt) {
  pressT -= dt; if (pressT > 0) return;
  pressT = 9 + R() * 8;
  const delving = beings.filter((b) => b.job === "delve").length, raiding = beings.filter((b) => b.job === "raid").length;
  if (w.mush < 25 && raiding < 3 && R() < 0.7) sendRaid(1 + (R() * (w.food > 50 ? 3 : 2)) | 0, true);
  else if (w.gold < 20 && delving < 3 && R() < 0.7) sendDelvers(1 + (R() * 2) | 0, true);
  // rare events
  if (R() < 0.04 && w.wakeAt < Date.now()) wake(false);
  if (R() < 0.03 && !forcedRain) { forcedRain = Date.now() + 120000; flood = 1; say("A storm flooded the grotto.", "Una tormenta inundó la gruta."); }
}
let flood = 0;
function wake(byFate) {
  w.wakeAt = Date.now() + 60000;
  const deep = w.levels.length - 1, g = guardian();
  if (g) { g.job = "guardian-awake"; emote(g, "angry", 6); }
  shake = 1.2;
  say(byFate ? "Fate woke the guardian; the deep trembled." : "The guardian stirred on its hoard.", byFate ? "El destino despertó al guardián; tembló el abismo." : "El guardián se removió sobre su tesoro.");
  if (byFate) { w.hoard += 30; const c = w.cols[(R() * NC) | 0]; if (c.rooms.length > 1) c.rooms.pop(); }
}
const guardian = () => beings.find((b) => b.job === "guardian" || b.job === "guardian-awake");

// ---------- catch-up while closed ----------
function catchUp() {
  const gone = Math.min((Date.now() - (w.saved || Date.now())) / 1000, 6 * 3600);
  if (gone < 90) return;
  const before = w.chron.length, f0 = w.food | 0, g0 = w.gold | 0;
  for (let s = 0; s < gone; s += 20) {
    simTick(20, true);
    if (R() < 0.12) { if (w.hoard > 4 && R() < 0.7) { w.hoard -= 4; w.gold += 4; } else { const n = nameOf(false); w.graves.push({ name: n, at: Date.now() - (gone - s) * 1000 }); say(`${n} never came back from the deep.`, `${n} nunca volvió de las profundidades.`); } }
    if (R() < 0.12 && w.food > 4) { w.food -= 4; w.mush += 5; }
  }
  const lines = w.chron.slice(before).slice(-5).map((c) => "- " + (ES ? c.es : c.en));
  const hrs = gone >= 3600 ? Math.round(gone / 3600) + " h" : Math.round(gone / 60) + " min";
  showCard(T("While you were away", "Mientras no estabas") + ` (${hrs})`,
    (lines.length ? lines.join("\n") : T("The town slept and the deep was quiet.", "El pueblo durmió y el abismo calló.")) +
    "\n" + T(w.food > f0 ? "The granary is fuller." : "The granary is emptier.", w.food > f0 ? "El granero está más lleno." : "El granero está más vacío."), 11000);
}

// ---------- drawing ----------
let glance = null, glanceT = 30; // the idle camera now and then leans in on a raid or a delve
let shake = 0, camZ = 1, camX = 0, camY = 0, tNow = 0;
const stars = Array.from({ length: 90 }, () => [R(), R() * 0.6, R()]);

    "Hecho para el desafío de juguetes idle. Música: el motor LOFI de Clockscapes (código propio). Tiempo: Open-Meteo (CC BY 4.0).\nLos monstruos son nombres del SRD abierto de Swords & Wizardry, Open Game Content bajo la Open Game License 1.0a. Sección 15: Open Game License v1.0a, Copyright 2000, Wizards of the Coast, Inc. Swords & Wizardry Core Rules, Copyright 2008, Matthew J. Finch."), 14000);
}
function first() {
  const k = card.classList.contains("on");
  if (!k) showCard(T("Dungeon Town", "Pueblo Mazmorra"), T("Tap a being to follow it. Tap the sky or the rock for the horn, the drum and fate.", "Toca un ser para seguirlo. Toca el cielo o la roca para el cuerno, el tambor y el destino."), 6000);
}
cv.addEventListener("click", (e) => {
  startAudio();
  const px = e.clientX / S, py = e.clientY / S;
  const ox = Math.min(0, Math.max(W - W * camZ, W / 2 - camX * camZ)), oy = Math.min(0, Math.max(H - H * camZ, H / 2 - camY * camZ));
  const wxp = (px - ox) / camZ, wyp = (py - oy) / camZ;
  let best = null, bd = 14 / camZ + 6;
  for (const b of beings) { const d = Math.hypot((b.climb ? shaftX() : b.x) - wxp, floorY(b.lvl) - 4 - wyp); if (d < bd) { bd = d; best = b; } }
  if (best && best !== follow) {
    follow = best; ui.classList.remove("on");
    const kind = best.side === "d" ? (best.job === "guardian" || best.job === "guardian-awake" ? T("the guardian", "el guardián") : best.role ? T(w.cast[best.role][1], w.cast[best.role][2]) : "") : best.job === "delve" ? T("delver", "aventurero") : best.job === "animal" ? T("animal", "animal") : T("townsfolk", "vecino");
    showCard(best.name + (kind ? ", " + kind : ""), (best.story.length ? best.story.join(", ") : T("Lives quietly, for now.", "Vive tranquilo, por ahora.")) + "\n" + T("Tap the scene again to let them go.", "Toca la escena otra vez para soltarlo."), 4500);
    return;
  }
  if (follow) { follow = null; return; }
  if (wxp < MARGIN * 0.72 && Math.abs(wyp - G) < 24 && w.graves.length) { showCard(T("The hill of graves", "La colina de las tumbas"), w.graves.slice(-12).map((g) => g.name).join(", "), 6000); return; }
  mainMenu();
});
addEventListener("keydown", (e) => { if (e.key === "h") sendDelvers(3, true); if (e.key === "d") sendRaid(3, true); if (e.key === "m") { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8; } if (e.key === "Escape") follow = null; });

function addGuardian() {
  const j = w.levels.length - 1, L = w.levels[j];
  const old = guardian(); if (old) old.dead = true;
  beings.push({ side: "d", sp: "dragon", job: "guardian", x: levelLeft(j) + 52, lvl: -(j + 1), path: [], t: 0, face: -1, wait: 0, name: nameOf(true) + T(" the Old", " el Viejo"), story: [T("sleeps on the hoard", "duerme sobre el tesoro")], born: 0 });
}
function save() { if (!w) return; w.saved = Date.now(); store.set(KEY, w); }

// ---------- main loop ----------
let last = performance.now(), saveT = 0, simAcc = 0;
const FAST = Q.get("fast") ? 8 : 1;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; tNow += dt;
  Gt = groundTarget(); G += (Gt - G) * Math.min(1, dt * 0.8);
  simAcc += dt * FAST; while (simAcc > 0.5) { simAcc -= 0.5; simTick(0.5, false); }
  pressures(dt * FAST);
  for (const b of beings) stepBeing(b, dt * FAST);
  beings = beings.filter((b) => !b.dead);
  const g = guardian();
  if (!g || Math.round(-g.lvl - 1) !== w.levels.length - 1) addGuardian();
  else { g.x = levelLeft(w.levels.length - 1) + 52; if (g.job === "guardian-awake" && w.wakeAt < Date.now()) g.job = "guardian"; }
  const town = beings.filter((b) => b.side === "t" && b.job === "folk").length, rooms = w.cols.reduce((s, c) => s + c.rooms.length, 0);
  if (town < rooms && R() < dt * 0.3) { const ci = (R() * NC) | 0; mk({ side: "t", sp: pick(["folk0", "folk1", "folk2", "folk3", "folk4", "folk5"]), x: shaftX(), lvl: 0, job: "folk", path: [{ x: colX(ci) + 40 }] }); }
  if (town > rooms + 2) { const b = beings.find((b) => b.job === "folk" && b !== follow); if (b) b.dead = true; }
  const mons = beings.filter((b) => b.side === "d" && b.job !== "guardian" && b.job !== "guardian-awake").length, cells = w.levels.reduce((s, L) => s + L.n, 0);
  if (mons < cells - 1 && R() < dt * 0.2) spawnMonster((R() * w.levels.length) | 0);
  if (mons > cells + 3) { const b = beings.find((b) => b.side === "d" && b.job !== "guardian" && b.job !== "guardian-awake" && b.job !== "raid" && b !== follow); if (b) b.dead = true; }
  if (w.ended) { // the point of no return: this city is lost on this device, a new town is founded elsewhere
    const old = w.city; lost.push(old); store.set("dungeontown.r4.lost", lost);
    const next = CITIES.find((c) => !lost.includes(c[0])) || CITIES[(R() * CITIES.length) | 0];
    w = newWorld(next[0]); G = Gt = groundTarget(); populate(); addGuardian(); save(); fetchWeather();
    showCard(T(`${old} is gone`, `${old} ya no existe`), T(`After seven ages the town fell for good. Its name stays in the rock. Settlers founded a new town in ${next[0]}.`, `Tras siete eras el pueblo cayó para siempre. Su nombre queda en la roca. Unos colonos fundaron un pueblo nuevo en ${next[0]}.`), 12000);
  }
  glanceT -= dt;
  if (glanceT <= 0) { glanceT = 40 + R() * 30; const c = beings.filter((b) => b.job === "raid" || b.job === "delve" || b.job === "guardian-awake"); if (c.length && !follow && !ui.classList.contains("on")) glance = { b: pick(c), until: tNow + 14 }; }
  if (uiT > 0) { uiT -= dt; if (uiT <= 0) ui.classList.remove("on"); }
  draw(dt);
  musicTick();
  saveT += dt; if (saveT > 10) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

(async function boot() {
  await loadArt();
  if (!w) { w = newWorld(CITIES[0][0]); say(`${w.city} was founded above an old cellar.`, `Se fundó ${w.city} sobre una vieja bodega.`); }
  else catchUp();
  NC = w.nc;
  MARGIN = Math.max(24, (W - NC * RW) / 2);
  addEventListener("resize", () => { MARGIN = Math.max(24, (W - NC * RW) / 2); });
  G = Gt = groundTarget();
  populate(); addGuardian();
  fetchWeather(); setInterval(fetchWeather, 30 * 60000);
  // the first party of a new town loses one of its own, so the grave on the hill is seen early
  if (!w.chron.some((c) => c.en.includes("delvers"))) setTimeout(() => { sendDelvers(2, true); const d = beings.filter((b) => b.job === "delve").pop(); if (d && !w.graves.length) d.doomed = true; }, 4000);
  setTimeout(() => sendRaid(2, true), 14000);
  setTimeout(() => { if (w.wakeAt < Date.now()) wake(false); }, 75000); // a rare event shows itself in the first minutes
  first();
  requestAnimationFrame(frame);
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
addEventListener("pagehide", save);
</script>
