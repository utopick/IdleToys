       *   or all false) a song plays its plain score, which a test pins with a fingerprint.
       * The first drum loop, its bass rhythm and the chord hits are TUNE.Pocket's JAM "Lo-fi" loop (lazy beat).
       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of
       *   its leads, another one plays the solo section) and the bass, which drum kit plays the loop (KITS maps
       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in
       *   band, voices, drums, hits and echo, so the Player only follows the sheet.
       * Each song grows from a gene of three moves between scale degrees (sheet.motif). The moves walk the
       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.
       * Melodies: A and B come back as A2 and B2 with their first and third bars kept and a new second bar and
       *   ending, and every song has a four-bar solo. Some songs add a ticking clock (CLICKS) under the drums.
       * To add a band, add a row to BANDS and, if it needs a new sound, write that voice as a Player method

       *   (chords and leads, which get the echo) or this.bus (bass and drums). Give it at least two leads. Then
       *   render a song with it and set its level so it sounds about as loud as the others; the test checks
       *   that every band turns up and that every voice it names exists.
       * Regional music: mood.region names a style (STYLES), which bends the song towards a place: its scale,
       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a
       *   place's style in OWN_REGIONS and REGIONS. Without a style the dice are thrown exactly as before, so a
       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.
       * This script stands alone (it uses nothing from the main script), so it can be copied into another
       * page as it is: everything it offers is the LOFI object it defines.

        const MOVES = [3, -3, 3, -3, 1, -1, 2, -2];

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";

          let a = seed >>> 0;

            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",

            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],

            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));

            colour = COLOURS[colourName];

  if (hudT > 0 && (hudT -= dt) <= 0) $("hud").classList.remove("on");
  $("bFate").classList.toggle("wait", Date.now() - S.nudgeAt < 18e5);
}
const roleOf = o => ({ folk: T("townsfolk", "vecino"), delver: T("delver", "aventurero"), trader: T("trader", "mercader"), gob: ES ? CAST.worker[1].slice(0, -1) : CAST.worker[0].slice(0, -1), lurk: T(CAST.lurker[0], CAST.lurker[1]), animal: T("a good dog", "un buen perro") })[o.k];
function tag(s, secs) { const e = $("tag"); if (e.textContent !== s) e.textContent = s; e.classList.add("on"); tagT = secs; }
function setFollow(o) { follow = o; if (!o) tagT = .01; music.dirty = 1; }
function showChron(title) {
  if (!fresh.length) return;
  const e = $("chron"); e.textContent = "";
  const h = document.createElement("b"); h.textContent = title; e.append(h);
  for (const s of fresh.slice(-6)) { const p = document.createElement("div"); p.textContent = "· " + s; e.append(p); }
  const c = document.createElement("small"); c.textContent = "Monsters: Swords & Wizardry Core Rules, © 2008 Matthew J. Finch (Open Game License 1.0a). Music: Clockscapes LOFI."; e.append(c);
  fresh = []; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 12000);
}
cv.addEventListener("pointerdown", e => {
  startAudio(); $("chron").classList.remove("on");
  const z = cam.z, vx = cam.cx - W / z / 2 + e.clientX / SC / z, vy = cam.cy - H / z / 2 + e.clientY / SC / z;
  let best = null, bd = 10;
  for (const o of beings) { const dd = Math.hypot(o.x - vx, o.y - 4 - vy); if (dd < bd) { bd = dd; best = o; } }
  if (best) { setFollow(best); return; }
  if (follow) { setFollow(null); return; }
  if (P.cemW && S.graves.length && vx >= P.cemX - 3 && vx <= P.cemX + P.cemW + 3 && vy > GY - 12 && vy < GY + 4) { tag(T("Here lie ", "Aquí yacen ") + S.graves.slice(-5).join(", "), 5); return; }
  $("hud").classList.add("on"); hudT = 6;
});
const btn = (id, en, es, fn) => { const e = $(id); e.title = T(en, es); e.setAttribute("aria-label", T(en, es)); e.addEventListener("click", () => { startAudio(); hudT = 6; fn(); }); };
btn("bHorn", "Horn: send a delver below", "Cuerno: envía un aventurero abajo", () => { const o = sendDelver(); blip(330, 392); tag(T("The horn calls ", "El cuerno llama a ") + o.name, 3); });
btn("bDrum", "Drum: send the monsters up", "Tambor: sube a los monstruos", () => { let n = 0; for (const o of beings) if (o.k === "gob" && n < 2 && o.task !== "raid" && !o.carry) { raid(o); o.wait = 0; n++; } blip(98, 82); tag(T("The drum wakes the deep", "El tambor despierta lo hondo"), 3); });
btn("bFate", "Nudge fate (once every 30 minutes)", "Empuja el destino (una vez cada 30 minutos)", () => {
  const left = 18e5 - (Date.now() - S.nudgeAt);
  if (left > 0) { tag(T("Fate rests for ", "El destino descansa ") + Math.ceil(left / 6e4) + " min", 3); return; }
  S.nudgeAt = Date.now(); const r = Math.random();
  if (r < .4) { rainT = 180; S.shroom = Math.min(100, S.shroom + 20); log("rain"); music.dirty = 1; }
  else if (r < .75) { S.food = Math.max(0, S.food - 20); log("feast"); for (const o of beings) { if (o.k === "folk") { go(o, P.hall + Math.random() * 20 - 10, 0, "stroll"); say(o, "heart"); } if (o.k === "gob" && Math.random() < .5) raid(o); } }
  else wake();
  showChron(T("Fate is nudged", "El destino se mueve")); save();
});
btn("bMute", "Sound on or off", "Sonido sí o no", () => { S.mute = !S.mute; applyMute(); save(); });

// ---- music: the Clockscapes engine with two rows of our own, a filter and a drone for the deep ----
const music = { ctx: null, songs: [], dirty: 0, mood: "" };
function applyMute() { $("mWave").style.display = S.mute ? "none" : ""; if (music.ctx) music.master.gain.setTargetAtTime(S.mute ? 0 : .8, music.ctx.currentTime, .1); }
function startAudio() {
  if (music.ctx) { if (music.ctx.state === "suspended") music.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext, c = music.ctx = new AC();
    music.master = c.createGain(); music.master.connect(c.destination);
    music.lp = c.createBiquadFilter(); music.lp.type = "lowpass"; music.lp.frequency.value = 9000; music.lp.connect(music.master);
    music.bus = c.createGain(); music.bus.gain.value = .9; music.bus.connect(music.lp);
    music.drone = c.createGain(); music.drone.gain.value = 0; const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 260; f.connect(music.drone); music.drone.connect(music.master);
    for (const hz of [55, 55.4, 82.4, 110.3]) { const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz; const og = c.createGain(); og.gain.value = .12; o.connect(og); og.connect(f); o.start(); }
    applyMute(); setInterval(tickMusic, 300); tickMusic();
  } catch (e) { music.ctx = null; }
}
function blip(a, b2) { const c = music.ctx; if (!c || S.mute) return; const o = c.createOscillator(), gn = c.createGain(), t = c.currentTime; o.type = "triangle"; o.frequency.setValueAtTime(a, t); o.frequency.linearRampToValueAtTime(b2, t + .5); gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(.25, t + .05); gn.gain.exponentialRampToValueAtTime(.001, t + .9); o.connect(gn); gn.connect(music.master); o.start(t); o.stop(t + 1); }
function tickMusic() {
  const c = music.ctx; if (!c || c.state !== "running" || typeof LOFI === "undefined") return;
  const now = c.currentTime, hr = new Date().getHours(), night = hr < 7 || hr >= 20, below = !!(follow && follow.f > 0);
  const mood = (night || below ? "dungeon" : "medieval") + (rainT > 0 ? "r" : "") + (wakeT > 0 ? "w" : "");
  const cur = music.songs[music.songs.length - 1];
  try {
    if (!cur || now > cur.end - 8 || mood !== music.mood) {
      music.mood = mood;
      if (cur) { const old = cur; old.fadeOut(now, 6); setTimeout(() => { try { old.dispose(); } catch (e) {} music.songs = music.songs.filter(s => s !== old); }, 8000); }
      const sheet = LOFI.song((S.seed + S.age * 13 + (Date.now() / 1000 | 0)) >>> 0, { night: night || below ? 1 : 0, rain: rainT > 0 ? .7 : 0, thunder: wakeT > 0, region: night || below ? "dungeon" : "medieval", crowd: 0 });
      music.songs.push(new LOFI.Player(c, music.bus, sheet, now + .1, cur ? 6 : 3));
    }
    for (const s of music.songs) s.schedule(now + 1.5);
  } catch (e) { if (!music.err) { music.err = 1; console.warn("music", e); } }
  music.lp.frequency.setTargetAtTime(below ? 900 : night ? 3200 : 9000, now, 1.5);
  music.drone.gain.setTargetAtTime(below ? .5 : night ? .22 : .04, now, 2);
}

addEventListener("resize", () => { clearTimeout(build.t); build.t = setTimeout(build, 200); });
addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
addEventListener("keydown", e => { const k = e.key.toLowerCase(); if (k === "h") $("bHorn").click(); if (k === "d") $("bDrum").click(); if (k === "f") $("bFate").click(); if (k === "m") $("bMute").click(); if (k === "escape") setFollow(null); });
build(); applyMute(); requestAnimationFrame(loop);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
