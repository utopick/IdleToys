       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of

       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in

       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.

       *   render a song with it and set its level so it sounds about as loud as the others; the test checks

       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a
       *   place's style in OWN_REGIONS and REGIONS. Without a style the dice are thrown exactly as before, so a
       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";

            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",

            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],
            mode = MODES[modeName];
          const minorRoll = r() < 0.25 + 0.5 * night,
            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));
          const motif = [pick(MOVES), pick(MOVES), pick(MOVES)];
          let colourName = pick(Object.keys(COLOURS)),
            colour = COLOURS[colourName];

    else { r.fillStyle = "#6a6470"; r.fillRect(x, y, 4, 3); r.fillStyle = "#847e8a"; r.fillRect(x + 1, y, 2, 1); }

}

// ---- real time and light ----
function sky(now) {
  const h = now.getHours() + now.getMinutes() / 60;
  const el = Math.sin(((h - 6) / 12) * Math.PI); // 1 at noon, -1 at midnight
  return { h, el, night: clamp(0.5 - el * 1.5, 0, 1) };
}
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
const STARS = Array.from({ length: 120 }, () => [Math.random() * W, Math.random() * 90, Math.random()]);

// ---- beings ----
const beings = [];
function walker(kind, path, o) { const b = Object.assign({ kind, path: path.slice(), x: path[0][0], y: path[0][1], sp: 9, t: Math.random() * 9, flip: false, wait: 0, carry: 0 }, o); beings.push(b); return b; }
const DOWN = [[66 + HALL, GY], [SHAFT, GY], [SHAFT, F1], [LADDER, F1], [LADDER, F2], [26, F2]];
const RAID = [[LAIR, F2], [LADDER, F2], [LADDER, F1], [SHAFT, F1], [SHAFT, GY], [266, GY]];
const count = (k) => beings.filter((b) => b.kind === k).length;
function sendParty(n) {
  for (let i = 0; i < n; i++) walker("adv", DOWN, { pal: { k: pick(["#9aa4b0", "#c9a03c", "#7a5a34"]), f: pick(SKIN), r: pick(CLOTH), b: "#3a2a22", s: "#d8dde4" }, wait: i * 1.4, sp: rnd(8, 11), out: 1 });
}
function sendRaid(n) {
  for (let i = 0; i < n; i++) walker("mon", RAID, { pal: { g: pick(["#5e9a4a", "#7aa83c", "#4a8a7a"]), y: "#f4e04a", w: "#f0f0e0" }, wait: i * 1.6, sp: rnd(7, 10), out: 1 });
}
// the farmers stay at the mushrooms, the citizens walk the street
for (let i = 0; i < 2; i++) walker("farm", [[210 + i * 70, F1]], { pal: { g: "#6a8a4a", y: "#f4e04a", w: "#f0f0e0" } });
for (let i = 0; i < 9; i++) walker("cit", [[rnd(20, W - 20), GY]], { pal: { h: pick(["#3a2a22", "#c9a03c", "#d8d0c0", "#8a3a22"]), f: pick(SKIN), c: pick(CLOTH), b: "#3a2a22" } });
let clashFx = [], trapT = 0, toast = "", toastT = 0, bellT = 0;

function wanderTarget(b, lo, hi) { b.path = [[b.x, b.y], [rnd(lo, hi), b.y]]; b.wait = rnd(1, 5); }
function arrive(b, S) {
  if (b.kind === "adv") {
    if (b.out) { b.out = 0; if (E.dg > 0) { E.dg--; b.carry = 1; } b.path = DOWN.slice().reverse(); b.wait = 1.2; }
    else { if (b.carry) { E.cg = Math.min(12, E.cg + 1); sparkle(66 + HALL, GY - 6, "#f4d03f"); } b.dead = 1; }
  } else if (b.kind === "mon") {
    if (b.out) { b.out = 0; if (E.cf > 0) { E.cf--; b.carry = 2; } b.path = RAID.slice().reverse(); b.wait = 1; }
    else { if (b.carry) { E.df = Math.min(12, E.df + 1); sparkle(LAIR, F2 - 6, "#c8e07a"); } b.dead = 1; }
  } else if (b.kind === "trader") {
    if (b.out) { b.out = 0; b.wait = 3; if (E.cg > 0 && E.cf < 10) { /* a full granary buys nothing */ E.cg--; E.cf = Math.min(12, E.cf + 2); b.carry = 1; sparkle(b.x, GY - 10, "#f4d03f"); } b.path = b.path0.slice().reverse(); }
    else b.dead = 1;
  } else if (b.kind === "cit") wanderTarget(b, 4, W - 4);
  else if (b.kind === "farm") wanderTarget(b, 196, 330);
  save();
}
function sparkle(x, y, c) { for (let i = 0; i < 8; i++) clashFx.push({ x, y, vx: rnd(-8, 8), vy: rnd(-14, -4), t: 0.9, c }); }

function step(dt, S) {
  for (const b of beings) {
    b.t += dt;
    if (b.wait > 0) { b.wait -= dt; continue; }
    if (b.path.length < 2) { arrive(b, S); continue; }
    const [tx, ty] = b.path[1], dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    const v = b.sp * dt * (dy ? 0.7 : 1);
    if (d <= v) { b.x = tx; b.y = ty; b.path.shift(); if (b.path.length < 2) arrive(b, S); }
    else { b.x += (dx / d) * v; b.y += (dy / d) * v; if (dx) b.flip = dx < 0; }
    // the trap: some delvers are thrown back up, empty handed
    if (b.kind === "adv" && b.out && b.y === F1 && Math.abs(b.x - TRAP) < 0.6 && !b.tried) {
      b.tried = 1;
      if (Math.random() < 0.3) { trapT = 1; b.jump = 1; b.out = 0; b.path = [[b.x, F1], [SHAFT, F1], [SHAFT, GY], [66 + HALL, GY]]; b.wait = 0.8; }
    }
    if (b.jump) b.jump = Math.max(0, b.jump - dt * 1.5);
  }
  // when a delver and a raider meet they scuffle, then both go their way: nobody wins
  for (const a of beings) if (a.kind === "adv" && !a.wait) for (const m of beings)
    if (m.kind === "mon" && !m.wait && Math.abs(a.y - m.y) < 1 && Math.abs(a.x - m.x) < 4 && !a.met && !m.met) {
      a.met = m.met = 1; a.wait = m.wait = 1.6; a.flip = m.x < a.x; m.flip = a.x < m.x; sparkle((a.x + m.x) / 2, a.y - 6, "#ffffff");
      tone(880, 0.06, "square", 0.03); tone(660, 0.08, "square", 0.03, 0.08);
    }
  for (let i = beings.length - 1; i >= 0; i--) if (beings[i].dead) beings.splice(i, 1);
  for (const f of clashFx) { f.t -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 30 * dt; }
  clashFx = clashFx.filter((f) => f.t > 0);

}

// the world's own clock: production, trade, and who decides to go out
let tick = 0;
function think(S) {
  tick++;
  if (!S.night || S.night < 0.6) if (tick % 3 === 0) E.cf = Math.min(12, E.cf + 1); // the fields by day
  if (tick % 4 === 0 && E.df > 0) { E.df--; E.dg = Math.min(12, E.dg + 1); } // fed monsters dig gold
  if (count("adv") < 3 && E.dg >= 3 && Math.random() < 0.35 * (1.2 - S.night)) sendParty(1 + (Math.random() < 0.4));
  if (count("mon") < 3 && E.cf >= 3 && Math.random() < 0.15 + 0.35 * S.night) sendRaid(1);
  if (count("trader") < 1 && Math.random() < 0.12) {
    const L = Math.random() < 0.5, p = L ? [[-10, GY], [138, GY]] : [[W + 10, GY], [346, GY]];
    walker("trader", p, { path0: p, out: 1, sp: 6, pal: { h: "#5a3a22", f: pick(SKIN), c: pick(["#6a5a8a", "#8a6a3a", "#3a6a6a"]), b: "#2a1e18" } });
  }
  save();
}

// ---- drawing ----
function draw(now, S) {
  const t = performance.now() / 1000;
  // the sky follows the real hour
  const day = [[120, 170, 210], [200, 220, 230]], dusk = [[70, 50, 100], [230, 130, 90]], nite = [[12, 10, 30], [40, 30, 64]];
  const tw = clamp(1 - Math.abs(S.el) * 4, 0, 1);
  for (let y = 0; y < GY; y += 2) {
    const k = y / GY;
    let c = S.el > 0 ? mix(day[0], day[1], k) : mix(nite[0], nite[1], k);
    c = mix(c, mix(dusk[0], dusk[1], k), tw * 0.8);

  // sun by day, moon by night, crossing the sky with the hour

  for (let x = 0; x < W; x++) R(x, GY - 12 - Math.sin(x / 9 + 2) * 3, 1, 20, rgb(hill));

  for (let x = 380; x < W; x++) if ((x + (t * 12 | 0)) % 7 === 0) R(x, GY + 1, 2, 1, "#cde6f5");

  // the well over the shaft

  // the town hall and its clock, which shows the real hour

  for (let i = 0; i < 16; i++) R(51 + i, GY - 27 - i, 30 - i * 2, 1, "#4a3a5a");
  R(60, GY - 58, 12, 34, "#c4b494"); for (let i = 0; i < 8; i++) R(59 + i, GY - 59 - i, 14 - i * 2, 1, "#4a3a5a");
  R(65, GY - 72, 1, 5, "#3a2a22"); R(66, GY - 72, 3, 2, "#b8423c");
  const cx = 66, cy = GY - 46;
  g.fillStyle = "#3a2e26"; g.beginPath(); g.arc(cx, cy, 5.5, 0, 7); g.fill();
  g.fillStyle = S.night > 0.35 ? "#f8e8a8" : "#efe6cc"; g.beginPath(); g.arc(cx, cy, 4.6, 0, 7); g.fill();
  for (let i = 0; i < 12; i += 3) R(cx + Math.sin(i / 6 * Math.PI) * 4 - 0.5, cy - Math.cos(i / 6 * Math.PI) * 4 - 0.5, 1, 1, "#3a2e26");
  g.strokeStyle = "#2a1e18"; g.lineWidth = 1; g.beginPath();
  const ha = ((now.getHours() % 12) + now.getMinutes() / 60) / 6 * Math.PI, ma = now.getMinutes() / 30 * Math.PI;
  g.moveTo(cx, cy); g.lineTo(cx + Math.sin(ha) * 2.6, cy - Math.cos(ha) * 2.6);
  g.moveTo(cx, cy); g.lineTo(cx + Math.sin(ma) * 3.8, cy - Math.cos(ma) * 3.8); g.stroke();

  R(62, GY - 10, 8, 10, "#4a2e1e"); R(55, GY - 20, 3, 4, lit); R(74, GY - 20, 3, 4, lit);

    const s = (y * 3 - t * 40) % 9;

  }
  R(340, F2 - 3, 60, 3, "#2a4a7a");
  for (let x = 340; x < 400; x++) if ((x * 5 + (t * 6 | 0)) % 11 === 0) R(x, F2 - 3, 2, 1, "#6a9ad0");
  // the trap, its spikes jump when it springs
  const sh = trapT > 0 ? 4 : 1;
  for (let i = 0; i < 4; i++) R(TRAP - 3 + i * 2, F1 - sh, 1, sh, "#b8c0c8");
  R(TRAP - 4, F1, 9, 1, "#3a3a3a");
  // the mushroom farm grows with the food the monsters bring down
  const SLOTS = [200, 212, 224, 236, 248, 260, 272, 284, 296, 308, 320, 206];
  for (let i = 0; i < Math.max(2, E.df); i++) {
    const grow = i < E.df ? 1 : 0.4;
    const pal = { r: i % 3 ? "#c8503c" : "#d8a03c", w: "#f4ecd8", s: "#e8dcc0" };
    if (grow < 1) R(SLOTS[i], F1 - 2, 2, 2, "#c8b090");
    else spr(SP.mush, SLOTS[i] - 3, F1 - 5 + Math.sin(t + i) * 0.3, pal);
  }

    const w = Math.max(1, 30 - row * 3);

  }
  if ((t * 3 | 0) % 7 === 0) R(20 + (t * 13 % 20), F2 - 2 - (t % 3), 1, 1, "#ffffff");
  const breath = Math.sin(t * 1.2) > 0 ? 0 : 1, eye = Math.sin(t * 0.37) > 0.96 ? "#f4e04a" : "#2a1a3a";
  spr(SP.big, LAIR - 10, F2 - 15 + breath, { p: "#6a4a8a", q: "#8a6aa8", E: eye });
  if (eye === "#2a1a3a") { const z = (t * 0.7) % 3; g.fillStyle = `rgba(220,210,255,${1 - z / 3})`; g.font = "6px monospace"; g.fillText("z", LAIR + 4 + z * 2, F2 - 16 - z * 4); }
  // crystals in the walls glint now and then
  for (const [x, y, c] of [[160, F1 + 30, "#7ad0e0"], [230, F2 + 8, "#b07ae0"], [460, F1 + 24, "#7ae0a0"], [120, GY + 22, "#7ad0e0"]]) {
    R(x, y, 2, 3, c); R(x + 2, y + 1, 1, 2, c);
    if (Math.sin(t * 0.8 + x) > 0.93) { R(x - 1, y + 1, 4, 1, "#ffffff"); R(x + 1, y - 1, 1, 5, "#ffffff"); }
  }

    const tend = b.kind === "farm" && b.wait > 0 ? (Math.sin(b.t * 5) > 0 ? 1 : 0) : 0;
    spr(s, b.x - 4, b.y - 8 - bob - j + tend, b.pal, b.flip);

    if (b.carry === 1 && b.kind === "adv") R(b.x - 1, b.y - 11 - bob - j, 2, 2, "#f4d03f");
    if (b.carry === 2) R(b.x - 1, b.y - 11 - bob, 3, 2, "#e0b060");
  }
  for (const f of clashFx) R(f.x, f.y, 1, 1, f.c);

  const dk = g.createLinearGradient(0, GY, 0, H); dk.addColorStop(0, "rgba(0,0,0,0)"); dk.addColorStop(1, "rgba(8,4,16,0.45)");
  g.fillStyle = dk; g.fillRect(0, GY, W, H - GY);
}

// ---- sound: the dungeon synth songs, and small cues when you steer ----

function tone(f, d, type, v, at) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), gg = ac.createGain(), t0 = ac.currentTime + (at || 0);
  o.type = type; o.frequency.value = f; gg.gain.setValueAtTime(v, t0); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(gg).connect(master); o.start(t0); o.stop(t0 + d + 0.05);
}
function nextSong(start) {
  const S = sky(new Date());
  const sheet = LOFI.song(seedN++, { night: S.night, region: "dungeon", places: false });
  const p = new LOFI.Player(ac, master, sheet, start, 2);
  songs.push(p); p.schedule(start + 3);
}
function music() {
  if (!ac) return;
  const now = ac.currentTime, cur = songs.at(-1);
  if (!cur || now > cur.end - 4) nextSong(cur ? Math.max(now + 0.1, cur.end) : now + 0.1);
  for (const s of songs) s.schedule(now + 3);
  songs = songs.filter((s) => { if (now > s.end + 10) { s.dispose(); return false; } return true; });
}
function startAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
    music(); setInterval(music, 500);
  } catch (e) { ac = null; }
}

// ---- steering: tap the city to send delvers, tap the dungeon to stir a raid ----
const tip = document.getElementById("tip"), muteB = document.getElementById("mute");
let awakeT = 0;
function say(s) { tip.textContent = s; tip.style.opacity = 1; toastT = 3; }
function wake() { document.body.classList.add("awake"); awakeT = 4; }
cv.addEventListener("pointerdown", (e) => {
  const first = !ac; startAudio(); if (ac && ac.state === "suspended") ac.resume();
  wake();
  if (first) { say("Tap the town to send delvers below, tap the deep to stir the monsters"); return; }
  const r = cv.getBoundingClientRect(), y = ((e.clientY - r.top) / r.height) * H, x = ((e.clientX - r.left) / r.width) * W;
  if (y < GY) {
    if (x > HALL + 50 && x < HALL + 82 && y > GY - 72) { bellT = 2; const n = new Date(); say(`The bell rings ${(n.getHours() % 12) || 12} times`); for (let i = 0; i < ((n.getHours() % 12) || 12); i++) tone(523, 1.2, "sine", 0.06, i * 0.5); }
    else if (count("adv") < 6) { sendParty(2); say("The horn calls: delvers go down for gold"); tone(392, 0.25, "triangle", 0.07); tone(523, 0.4, "triangle", 0.07, 0.22); }
    else say("Enough delvers are below already");
  } else if (count("mon") < 6) { sendRaid(2); say("A drum in the deep: the monsters go up for food"); tone(70, 0.4, "sine", 0.2); tone(70, 0.4, "sine", 0.2, 0.35); }
  else say("The monsters are already out");
});
muteB.addEventListener("click", () => {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8;
  muteB.innerHTML = muted ? "&times;" : "&#9834;"; say(muted ? "Music off" : "Music on"); wake();
});

// ---- the loop ----
let last = performance.now(), acc = 0;
function frame(nowMs) {
  const dt = Math.min(0.1, (nowMs - last) / 1000); last = nowMs;
  const now = new Date(), S = sky(now);
  step(dt, S);
  acc += dt; if (acc > 2) { acc = 0; think(S); }
  if (toastT <= 0) tip.style.opacity = 0;
  awakeT -= dt; if (awakeT <= 0) document.body.classList.remove("awake");
  draw(now, S);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => { if (!ac) { tip.style.opacity = 1; toastT = 4; } }, 800);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
