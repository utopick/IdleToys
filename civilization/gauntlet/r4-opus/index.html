       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";
        }
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        function rngFrom(seed) {
          let a = seed >>> 0;
          return () => {
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function song(seed, mood = {}) {
          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",
            style = STYLES[styleName],
            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],
            mode = MODES[modeName];
          const minorRoll = r() < 0.25 + 0.5 * night,
            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));
          const motif = [pick(MOVES), pick(MOVES), pick(MOVES)];
          let colourName = pick(Object.keys(COLOURS)),
            colour = COLOURS[colourName];
          if (style?.colour)
            [colourName, colour] = Array.isArray(style.colour)
              ? ["own", style.colour]
              : [style.colour, COLOURS[style.colour]];
          // a diminished chord sounds wrong in a loop: V instead (the major key's vii, and in a mode any
          // chord with a diminished fifth)
          const dim = (d) => (mode ? (scale[(d + 4) % 7] - scale[d] + 12) % 12 === 6 : !minor && d === 6);
          const chordOn = (deg) => {
            let d = ((deg % 7) + 7) % 7;

            // where the 2nd or 9th would clash (a half step over the root), a plain seventh chord instead

          function voiced(keys, pc) {
            const lift = 12 * Math.ceil((52 - Math.min(...keys)) / 12); // lowest note in 52..63
            return { root: pc < 7 ? 36 + pc : 24 + pc, keys: keys.map((n) => n + lift) };
          }

          const unfold = (deg) =>
            [0, 1, 2, 3].map((i) => chordOn(deg + motif.slice(0, i).reduce((a, b) => a + b, 0)));

          let chords = unfold(start),
            chordsB = unfold(start + motif[0]); // B starts where A's second chord is

          if (prog) {

              voiced(

for (const id of ["card", "ring", "places", "book", "bar"]) { $(id).addEventListener("pointerup", (e) => { e.stopPropagation(); wake(); }); $(id).addEventListener("pointerdown", (e) => e.stopPropagation()); }
let down = null;
cv.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; });
cv.addEventListener("pointermove", (e) => { if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.hypot(dx, dy) > 10) { down.moved = true; cam.drag = true; cam.follow = null; cam.x = cam.tx = down.cx - dx / PX / cam.z; cam.y = cam.ty = down.cy - dy / PX / cam.z; } });
cv.addEventListener("pointerup", (e) => {
  startSound(); wake(); cam.drag = false; cam.next = performance.now() / 1000 + 20;
  if (!down || down.moved) { down = null; return; } down = null;
  const [tx, ty, wx, wy] = screenToTile(e.clientX, e.clientY);
  let best = null, bd = 9;
  for (const p of W.people) { const [sx, sy] = iso(p.x, p.y); const d = Math.hypot(sx - wx, sy - 6 - wy); if (d < bd) { bd = d; best = p; } }
  if (best) return openCard(best);
  if ($("ring").classList.contains("on") || $("card").classList.contains("on")) return panels();
  openRing(tx, ty);
});
addEventListener("wheel", (e) => { cam.wheel = true; cam.tz = Math.max(1, Math.min(3, cam.tz + (e.deltaY < 0 ? 1 : -1))); cam.z = cam.tz; wake(); });
addEventListener("keydown", (e) => { if (e.key === "m") $("bSound").click(); if (e.key === "+") cam.z = cam.tz = Math.min(3, cam.tz + 1); if (e.key === "-") cam.z = cam.tz = Math.max(1, cam.tz - 1); });

/* ================= SAVE + CATCH-UP ================= */
const KEY = "civilization.r4opus.v1";
function save() { W.last = Date.now(); store.set(KEY, W); }
function load() {
  const s = store.get(KEY);
  if (s && s.v === 1 && Array.isArray(s.tiles) && s.tiles.length === N * N && PLACES.some((p) => p.id === s.place) && !Q.get("seed")) {
    Object.assign(W, { pending: [], beasts: [], culture: { inventor: 0, priest: 0, rebel: 0 }, chron: [] }, s);
    W.people = (W.people || []).filter((p) => p && isFinite(p.x) && isFinite(p.y));
    // catch-up: the hours away pass in big steps (capped), then a line in the chronicle
    const away = Math.min(6 * 3600, (Date.now() - (W.last || Date.now())) / 1000), R = rng(W.seed + (W.t | 0));
    if (away > 60) { const before = buildingsList().length; let left = Math.min(away / 6, 900); while (left-- > 0) step(4, R, true); chron(T("While you were away, " + Math.max(0, buildingsList().length - before) + " new roofs rose.", "Mientras no estabas, se alzaron " + Math.max(0, buildingsList().length - before) + " tejados nuevos.")); }
    return;
  }
  const lang = (navigator.language || "").toLowerCase(), guess = lang.includes("es") ? "madrid" : lang.includes("ja") ? "tokyo" : lang.includes("pt") ? "lisboa" : "london";
  newWorld(PLACES.find((p) => p.id === guess), +Q.get("seed") || ((Math.random() * 1e6) | 0));
}
function centerCam() { const [x, y] = iso(W.cx + 0.5, W.cy + 0.5); cam.x = cam.tx = x; cam.y = cam.ty = y - 10; cam.z = cam.tz = Q.get("cam") === "region" ? 1 : 2; }

/* ================= MAIN ================= */
(async function main() {
  resize(); await loadArt(); load(); centerCam();
  const R = rng(W.seed ^ 0x5eed);
  let prev = performance.now() / 1000, saveT = 0, musT = 0;
  hint(T("Tap a person to whisper an idea, or a place to suggest something.", "Toca a una persona para susurrarle una idea, o un lugar para sugerir algo."));
  function frame() {
    const now = performance.now() / 1000, dt = Math.min(0.1, now - prev); prev = now;
    step(dt, R, false); updateCam(dt, now); drawWorld(now);
    if ((musT += dt) > 0.5) { musT = 0; musicTick(); }
    if ((saveT += dt) > 10) { saveT = 0; save(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  addEventListener("pagehide", save);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
