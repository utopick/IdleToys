          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",

          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));

addEventListener("keydown", (e) => { if (e.key === "m" || e.key === "M") mute(); else if (e.key === " " || e.key === "Enter") { startAudio(); woke = true; show(); } });
bm.addEventListener("click", mute); bp.addEventListener("click", picker);
function mute() { muted = !muted; try { localStorage.setItem(KEY + ".mute", muted ? "1" : "0"); } catch (e) {} if (gain) gain.gain.value = muted ? 0 : 0.8; startAudio(); show(T(muted ? "Music off." : "Music on.", muted ? "Música apagada." : "Música encendida.")); }
const pick = document.getElementById("pick");
function picker() { const pl = document.getElementById("pl"); pl.textContent = ""; document.getElementById("pt").textContent = T("Where on Earth? A new place starts a new world.", "¿En qué lugar de la Tierra? Un lugar nuevo empieza un mundo nuevo.");
  PLACES.forEach((p, i) => { const b = document.createElement("button"); b.textContent = p.n + (i === S.pi ? " ●" : ""); b.addEventListener("click", () => { if (confirm(T("Leave this world for ever and start again in " + p.n + "?", "¿Dejar este mundo para siempre y empezar de nuevo en " + p.n + "?"))) { newWorld(i); begin(); save(); songOver = true; } pick.classList.remove("on"); }); pl.append(b); });
  const pc = document.getElementById("pc"); pc.textContent = T("Stay here", "Quedarse aquí"); pc.onclick = () => pick.classList.remove("on"); pick.classList.add("on"); }
// music: the Clockscapes generator, a new song per era and path, in the place's own regional style at first
let AC, gain, player, songN = 0, songOver = false, songKey = "";
function moodNow() { const b = branch(); return { night, sea: !!P0.sea, warm: Math.abs(P0.lat) < 42, wind: Math.abs(P0.lat) > 50 ? 0.5 : 0.1, crowd: Math.min(0.6, S.B.length / 150), trains: b === "steam", region: b === "thatch" ? P0.st : b === "steam" ? "balkan" : b === "magic" ? "persian" : b === "neon" ? "techno" : "soul" }; }
function startAudio() { try { if (AC) { if (AC.state === "suspended") AC.resume(); return; } const A = window.AudioContext || window.webkitAudioContext; if (!A || typeof LOFI === "undefined") return; AC = new A(); gain = AC.createGain(); gain.gain.value = muted ? 0 : 0.8; gain.connect(AC.destination); nextSong(); setInterval(pump, 250); } catch (e) {} }
function nextSong() { const now = AC.currentTime, old = player; if (old) { old.fadeOut(now, 3); setTimeout(() => { try { old.dispose(); } catch (e) {} }, 5000); }
  songKey = branch() + S.pi; songOver = false; player = new LOFI.Player(AC, gain, LOFI.song((S.seed + S.era * 101 + songN++ * 7) >>> 0, moodNow()), now + 0.1, 2, { drift: true, breathe: true, swell: true }); player.schedule(now + 2); }
function pump() { try { if (!player) return; const now = AC.currentTime; if (songOver || songKey !== branch() + S.pi || now > player.end - 3) nextSong(); else player.schedule(now + 2); } catch (e) {} }
// main loop
function begin() { P0 = PLACES[S.pi]; populate(); dirty = 1; cam.x = px(CX, CY); cam.y = py(CX, CY); mode = 0; modeT = 10; follow = null; }
// ?age=900 shows a fresh world that many seconds old, without touching the saved one (for looking at later eras)
const AGE = Math.min(6000, +new URLSearchParams(location.search).get("age") || 0);
if (AGE || !load()) { let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {} const lon = -new Date().getTimezoneOffset() / 4; let bi = 0; PLACES.forEach((p, i) => { if (Math.abs(p.lon - lon) < Math.abs(PLACES[bi].lon - lon)) bi = i; }); PLACES.forEach((p, i) => { if (tz.includes(p.n.split(" ")[0])) bi = i; }); newWorld(bi); for (let i = 0; i < AGE; i++) step(); for (const b of S.B) b.p = Math.max(b.p, 0.9); }
begin(); cam.z = Math.max(1.4, Math.min(W, H) / 330);
let lastT = performance.now(), acc = 0;
function frame(t) { const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t; time += dt; acc += dt; while (acc >= 1) { acc -= 1; step(); if (S.tick % 10 === 0) save(); }
  live(dt); camera(dt); draw(); if (hudT > 0 && (hudT -= dt) <= 0) hud.classList.remove("on"); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
addEventListener("pagehide", save); document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else if (S) { const gone = Math.min(4000, Math.floor((Date.now() - S.last) / 1000)); for (let i = 0; i < gone; i++) step(); } });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
