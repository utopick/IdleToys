<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>Ashes &amp; Seeds</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<!--
  Ashes & Seeds: an idle civilization that grows on the ruins of a real city (gauntlet r3, opus).
  Code layout: ART (loads art/index.json and its sheets), WORLD (map from seed and place), SIM (pure
  simulation: growth, eras, events, people and their stories, no drawing), VIEW (camera, drawing, light),
  UI (whispers), MUSIC (Clockscapes LOFI, copied below). Storage key: civilization.r3opus.v1
-->
<style>
  html, body { margin: 0; height: 100%; background: #14121c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#v { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .ui { font: 600 15px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #f4e8cc; }
  #corner { position: fixed; right: 12px; top: 12px; display: flex; gap: 10px; transition: opacity .6s; }
  #corner.off { opacity: 0; pointer-events: none; }
  .btn { min-width: 52px; min-height: 52px; border: 2px solid #f4e8cc55; background: #1c1826e8; color: #f4e8cc; border-radius: 6px; font: inherit; cursor: pointer; padding: 6px 10px; }
  .btn:active { background: #3a3046; }
  .btn[disabled] { opacity: .35; }
  #sheet { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(94vw, 520px); background: #1a1622f2; border: 2px solid #c8a86a88; border-radius: 8px; padding: 12px; box-sizing: border-box; display: none; }
  #sheet.on { display: block; }
  #sheet h3 { margin: 0 0 4px; font-size: 17px; color: #ffd98a; }
  #sheet p { margin: 0 0 10px; color: #d8ccb0; font-weight: 400; }
  #sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #sheet .row .btn { flex: 1 1 22%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #sheet canvas { width: 48px; height: 48px; image-rendering: pixelated; }
  #toast { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); max-width: 86vw; text-align: center; background: #120f18d8; padding: 10px 16px; border-radius: 6px; border: 1px solid #ffd98a66; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #places { max-height: 46vh; overflow: auto; }
</style>
</head>
<body>
<canvas id="v"></canvas>
<div id="corner" class="ui off">
  <button class="btn" id="bPlace" title="Place / Lugar">⌖</button>
  <button class="btn" id="bMute" title="Sound / Sonido">♪</button>
</div>
<div id="sheet" class="ui"></div>
<div id="toast" class="ui"></div>
<script>
"use strict";
// ================= small helpers =================
const ES = (navigator.language || "en").toLowerCase().startsWith("es");
const L = (en, es) => (ES ? es : en);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const pick = (r, a) => a[Math.floor(r() * a.length)];
const Q = new URLSearchParams(location.search);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const KEY = "civilization.r3opus.v1";

// ================= ART =================
const ART = { frames: {}, anims: {}, warned: new Set() };
async function loadArt() {
  let list = [];
  try { list = (await (await fetch("art/index.json")).json()).sheets || []; } catch (e) { console.warn("art/index.json missing", e); }
  await Promise.all(list.map(async (file) => {
    try {
      const js = await (await fetch("art/" + file)).json();
      const img = new Image(); img.src = "art/" + js.image; await img.decode();
      for (const f of js.frames || []) ART.frames[f.name] = { img, x: f.x, y: f.y, w: f.w, h: f.h, ax: (f.anchor || [f.w / 2, f.h])[0], ay: (f.anchor || [f.w / 2, f.h])[1] };
      Object.assign(ART.anims, js.animations || {});
    } catch (e) { console.warn("art sheet failed: " + file); }
  }));
}
function spr(c, name, x, y, flip) {
  const f = ART.frames[name];
  if (!f) { if (!ART.warned.has(name)) { ART.warned.add(name); console.warn("missing frame " + name); } c.fillStyle = "#8a6a8a"; c.fillRect(Math.round(x) - 6, Math.round(y) - 12, 12, 12); return; }
  if (flip) { c.save(); c.translate(Math.round(x), 0); c.scale(-1, 1); c.drawImage(f.img, f.x, f.y, f.w, f.h, -f.ax, Math.round(y) - f.ay, f.w, f.h); c.restore(); }
  else c.drawImage(f.img, f.x, f.y, f.w, f.h, Math.round(x) - f.ax, Math.round(y) - f.ay, f.w, f.h);
}
const has = (n) => !!ART.frames[n];

// ================= PLACES (baked: rough real geography of each city) =================
// coast: side of the map that is sea; river: "ns" | "ew" | "diag" | ""; dry: desert climate
const PLACES = [
  { id: "madrid", name: "Madrid", lat: 40.42, lon: -3.70, river: "ns", coast: "", dry: 0.4 },
  { id: "lisboa", name: "Lisboa", lat: 38.72, lon: -9.14, river: "ew", coast: "S", dry: 0.2 },
  { id: "paris", name: "Paris", lat: 48.86, lon: 2.35, river: "diag", coast: "", dry: 0 },
  { id: "london", name: "London", lat: 51.51, lon: -0.13, river: "ew", coast: "", dry: 0 },
  { id: "nyc", name: "New York", lat: 40.71, lon: -74.0, river: "ns", coast: "E", dry: 0 },
  { id: "tokyo", name: "Tokyo", lat: 35.68, lon: 139.69, river: "diag", coast: "S", dry: 0 },
  { id: "cairo", name: "Cairo", lat: 30.04, lon: 31.24, river: "ns", coast: "", dry: 1 },
  { id: "venezia", name: "Venezia", lat: 45.44, lon: 12.33, river: "", coast: "E", dry: 0 },
  { id: "mexico", name: "Ciudad de México", lat: 19.43, lon: -99.13, river: "", coast: "", dry: 0.5 },
  { id: "reykjavik", name: "Reykjavík", lat: 64.15, lon: -21.94, river: "", coast: "N", dry: 0 },
];

// ================= WORLD + SIM (no drawing here) =================
const N = 40;
const T = { GRASS: 0, WATER: 1, SAND: 2, ASPH: 3, ROAD: 4, FIELD: 5, PLAZA: 6 };
const CULTURES = [
  { style: "celtic", syl: ["bra", "en", "mor", "dun", "ail", "ca", "rin", "fen", "o", "lach"] },
  { style: "galicia", syl: ["xo", "an", "ri", "ña", "bel", "ro", "sa", "lo", "mi", "ta"] },
  { style: "andean", syl: ["ku", "ya", "qa", "wa", "ri", "ma", "chi", "lla", "su", "pa"] },
  { style: "steppe", syl: ["tem", "ur", "ba", "khan", "ol", "si", "ga", "tu", "er", "dai"] },
  { style: "slavic", syl: ["mi", "ra", "vo", "slav", "ka", "dra", "zo", "ve", "lu", "na"] },
  { style: "persian", syl: ["da", "ra", "sha", "mi", "ro", "zan", "ne", "fa", "hu", "lai"] },
];
const ERA = [ // building kinds per era; temples and specials
  { homes: ["hut_a", "hut_b", "hut_c", "longhouse"], extra: ["barn", "windmill", "stall_a", "stall_b", "well"], temple: "temple0", road: "dirt" },
  { homes: ["house1_a", "house1_b", "house1_c"], extra: ["factory", "station", "stall_a", "stall_b"], temple: "temple1", road: "cobble" },
  { homes: { sol: ["sol_a", "sol_b"], mag: ["mag_a", "mag_b"] }, extra: [], temple: { sol: "sol_temple", mag: "mag_temple" }, road: "plaza" },
];
const ERA_AT = [0, 80, 190]; // ticks
const TICK_S = Q.has("fast") ? 0.3 : 3; // ?fast=1 runs the years ten times faster, for testing

function makeWorld(seed, placeId) {
  const r = rng(seed), place = PLACES.find((p) => p.id === placeId) || PLACES[0];
  const ground = new Array(N * N).fill(T.GRASS), obj = new Array(N * N).fill(null);
  const noise = (x, y, s) => { // value noise, two octaves
    let v = 0; for (const [f, a] of [[0.12, 0.65], [0.3, 0.35]]) { const X = x * f, Y = y * f, xi = Math.floor(X), yi = Math.floor(Y), tx = X - xi, ty = Y - yi;
      const sm = (t) => t * t * (3 - 2 * t), a1 = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
      v += a * (a1 + (b - a1) * sm(tx) + (c - a1 + (d - b - c + a1) * sm(tx)) * sm(ty)); } return v; };
  const sd = seed % 9973;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, wob = noise(x, y, sd + 1) * 6;
    let sea = false;
    if (place.coast === "S") sea = y > N - 9 + wob - 3; if (place.coast === "N") sea = y < 7 + wob - 3;
    if (place.coast === "E") sea = x > N - 9 + wob - 3; if (place.coast === "W") sea = x < 7 + wob - 3;
    if (sea) ground[i] = T.WATER;
  }
  if (place.river) { // a meandering river 2 tiles wide
    let p = N / 2 + (r() - 0.5) * 10;
    for (let k = 0; k < N; k++) {
      p += Math.sin(k * 0.35 + seed) * 0.9 + (r() - 0.5) * 0.6; const q = Math.round(p);
      for (const d of [0, 1]) { const [x, y] = place.river === "ns" ? [q + d, k] : place.river === "ew" ? [k, q + d] : [Math.min(N - 1, Math.max(0, Math.round(k * 0.7 + q * 0.3 - 6) + d)), k]; if (x >= 0 && x < N && y >= 0 && y < N) ground[y * N + x] = T.WATER; }
    }
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = y * N + x; if (ground[i] !== T.WATER) { let nearW = false; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < N && Y < N && ground[Y * N + X] === T.WATER) nearW = true; } if (nearW && (place.coast || place.dry > 0.6 || hash(x, y, 7) < 0.4)) ground[i] = T.SAND; } }
  // the ruins of now: a street grid around the centre, overgrown
  const c0 = 9, c1 = 31;
  for (let y = c0; y <= c1; y++) for (let x = c0; x <= c1; x++) {
    const i = y * N + x; if (ground[i] === T.WATER) continue;
    const street = (x - c0) % 6 === 0 || (y - c0) % 6 === 0;
    if (street && hash(x, y, 3) < 0.85) { ground[i] = T.ASPH; if (hash(x, y, 4) < 0.06) obj[i] = { k: "ruin_car" }; else if (hash(x, y, 5) < 0.05) obj[i] = { k: "ruin_pylon" }; }
    else if (!street) { const h = hash(x, y, 6), dc = Math.hypot(x - 20, y - 20); if (h < 0.22 - dc * 0.006) obj[i] = { k: dc < 7 && h < 0.08 ? pick(r, ["ruin_tower_a", "ruin_tower_b"]) : "ruin_block" }; }
  }
  // forests and rocks
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x; if (ground[i] !== T.GRASS || obj[i]) continue; const f = noise(x, y, sd + 9);
    if (f > 0.56 || hash(x, y, 8) < 0.04) obj[i] = { k: pick(r, place.dry > 0.6 ? ["bush_a", "bush_b", "rock_a", "tree_pine_a"] : f > 0.66 ? ["tree_pine_a", "tree_pine_b", "tree_oak_a"] : ["tree_oak_a", "tree_oak_b", "tree_oak_c", "tree_birch_a", "tree_autumn_a", "tree_autumn_b", "bush_a"]) };
    else if (hash(x, y, 11) < 0.015) obj[i] = { k: pick(r, ["rock_a", "rock_b"]) };
  }
  // founding spot: a free land tile near water and the ruins
  let home = [20, 20], best = -1;
  for (let k = 0; k < 400; k++) { const x = 6 + Math.floor(r() * 28), y = 6 + Math.floor(r() * 28), i = y * N + x; if (ground[i] === T.WATER) continue; let s = 0; for (let d = 1; d < 6; d++) for (const [dx, dy] of [[d, 0], [-d, 0], [0, d], [0, -d]]) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < N && Y < N && ground[Y * N + X] === T.WATER) s += 6 - d; } s -= Math.hypot(x - 20, y - 20) * 0.5; if (s > best) { best = s; home = [x, y]; } }
  const culture = Math.floor(r() * CULTURES.length);
  return { v: 1, seed, place: place.id, ground, obj, home, culture, tick: 0, era: 0, branch: "", lean: r() - 0.5, people: [], nextId: 1, chronicle: [], lastPlaceWhisper: 0, plan: [], event: null, born: Date.now(), saved: Date.now() };
}

const SIM = {
  w: null, r: null,
  name() { const c = CULTURES[this.w.culture], n = 2 + Math.floor(this.r() * 2); let s = ""; for (let i = 0; i < n; i++) s += pick(this.r, c.syl); return s[0].toUpperCase() + s.slice(1); },
  log(en, es, where) { const w = this.w; w.chronicle.push({ t: w.tick, en, es }); if (w.chronicle.length > 60) w.chronicle.shift(); SIM.onLog && SIM.onLog(L(en, es), where); },
  year() { return Math.floor(this.w.tick / 4); },
  free(x, y) { const w = this.w; if (x < 1 || y < 1 || x >= N - 1 || y >= N - 1) return false; const i = y * N + x; const o = w.obj[i]; return w.ground[i] !== T.WATER && w.ground[i] !== T.ROAD && w.ground[i] !== T.PLAZA && (!o || !o.b); },
  buildings() { return this.w.obj.map((o, i) => (o && o.b ? i : -1)).filter((i) => i >= 0); },
  kindFor(era, temple) { const E = ERA[era], br = this.w.branch || "sol"; if (temple) return typeof E.temple === "string" ? E.temple : E.temple[br]; const homes = Array.isArray(E.homes) ? E.homes : this.r() < 0.4 ? E.homes[br] : ERA[1].homes; /* the future keeps an old brick quarter between its towers */ return this.r() < 0.2 && E.extra.length ? pick(this.r, E.extra) : pick(this.r, homes); },
  place(x, y, kind) {
    const w = this.w, i = y * N + x, old = w.obj[i];
    if (old && /^ruin/.test(old.k)) this.dust = [x, y]; // quarried
    w.obj[i] = { k: kind, b: 1, era: w.era, t: w.tick }; if (w.ground[i] === T.FIELD) w.ground[i] = T.GRASS;
    this.road(x, y); this.changed = true;
  },
  road(x, y) { // a path from (x,y) to the nearest road; roads wear into the land
    const w = this.w; let bi = -1, bd = 1e9;
    for (let j = 0; j < N * N; j++) if (w.ground[j] === T.ROAD || w.ground[j] === T.PLAZA) { const d = Math.abs((j % N) - x) + Math.abs(((j / N) | 0) - y); if (d < bd) { bd = d; bi = j; } }
    let tx = bi < 0 ? w.home[0] : bi % N, ty = bi < 0 ? w.home[1] + 1 : (bi / N) | 0, cx = x, cy = y + 1;
    if (!this.lay(cx, cy)) cx = x + 1, cy = y;
    for (let g = 0; g < 80 && (cx !== tx || cy !== ty); g++) { if (cx !== tx && (g % 2 || cy === ty)) cx += Math.sign(tx - cx); else cy += Math.sign(ty - cy); this.lay(cx, cy); }
  },
  lay(x, y) { const w = this.w, i = y * N + x; if (x < 0 || y < 0 || x >= N || y >= N) return false; const o = w.obj[i]; if (o && o.b) return false; if (w.ground[i] === T.WATER) { w.obj[i] = { k: "bridge" }; return true; } if (w.ground[i] !== T.PLAZA) w.ground[i] = T.ROAD; if (o && !o.b) w.obj[i] = null; return true; },
  addPerson(role) { const w = this.w; const p = { id: w.nextId++, name: this.name(), born: w.tick - Math.floor(this.r() * 60), look: Math.floor(this.r() * 16), role: role || "", whisper: "", story: [] }; w.people.push(p); return p; },
  found() {
    const w = this.w, [hx, hy] = w.home; w.ground[hy * N + hx] = T.PLAZA; w.obj[hy * N + hx] = null;
    this.place(hx, hy - 1, "well"); this.place(hx - 1, hy, "hut_a"); this.place(hx + 1, hy, "hut_b");
    for (let k = 0; k < 5; k++) this.addPerson();
    this.log(`Year 0. A people came to the ruins of ${this.placeName()} and lit a fire.`, `Año 0. Un pueblo llegó a las ruinas de ${this.placeName()} y encendió un fuego.`, w.home);
  },
  placeName() { return (PLACES.find((p) => p.id === this.w.place) || PLACES[0]).name; },
  step() {
    const w = this.w, r = this.r; w.tick++;
    // eras
    const want = w.tick + (w.boost || 0) >= ERA_AT[2] ? 2 : w.tick + (w.boost || 0) >= ERA_AT[1] ? 1 : 0;
    if (want > w.era) {
      if (want === 2) w.branch = w.lean >= 0 ? "sol" : "mag";
      w.era = want; this.changed = true;
      if (want === 1) this.log(`Year ${this.year()}. Smoke and iron: the age of brick and steam begins.`, `Año ${this.year()}. Humo y hierro: empieza la era del ladrillo y el vapor.`, w.home);
      else if (w.branch === "sol") this.log(`Year ${this.year()}. They chose the sun: glass, gardens and quiet machines.`, `Año ${this.year()}. Eligieron el sol: cristal, jardines y máquinas silenciosas.`, w.home);
      else this.log(`Year ${this.year()}. They chose the old crystals: towers that hum with light.`, `Año ${this.year()}. Eligieron los viejos cristales: torres que zumban de luz.`, w.home);
    }
    // old buildings are rebuilt in the new style, a few at a time
    for (const i of this.buildings()) { const o = w.obj[i]; if (o.era < w.era && r() < 0.06) { const t = /temple/.test(o.k); o.k = this.kindFor(w.era, t); o.era = w.era; o.t = w.tick; this.changed = true; } }
    // roads wear in: dirt to cobble to stone plaza
    if (w.era > 0) for (let k = 0; k < 6; k++) { const i = Math.floor(r() * N * N); if (w.ground[i] === T.ROAD && (w.roadEra || (w.roadEra = {}))[i] !== w.era) { w.roadEra[i] = w.era; this.changed = true; } }
    // whispered plans they accepted
    if (w.plan.length && w.tick >= w.plan[0].at) { const p = w.plan.shift(); this.build(p); }
    // grow
    const bs = this.buildings(), plague = w.event && w.event.k === "plague";
    if (!plague && r() < (w.event && w.event.k === "golden" ? 0.8 : 0.45)) {
      for (let g = 0; g < 20; g++) {
        const i = pick(r, bs), x = (i % N) + Math.round((r() - 0.5) * 6), y = ((i / N) | 0) + Math.round((r() - 0.5) * 6);
        if (this.free(x, y) && Math.hypot(x - w.home[0], y - w.home[1]) < 4 + Math.sqrt(bs.length) * 1.6) {
          const temple = !bs.some((j) => /temple/.test(w.obj[j].k)) && bs.length > 8;
          if (w.era < 2 && r() < 0.28 && !temple) { w.ground[y * N + x] = T.FIELD; if (w.obj[y * N + x] && !w.obj[y * N + x].b) w.obj[y * N + x] = null; this.changed = true; }
          else this.place(x, y, this.kindFor(w.era, temple));
          break;
        }
      }
    }
    // people: births and deaths
    const cap = Math.min(70, 4 + bs.length * 2);
    if (w.people.length < cap && r() < 0.35) { const p = this.addPerson(); if (r() < 0.1) this.log(`${p.name} was born.`, `Nació ${p.name}.`); }
    for (const p of w.people) if (w.tick - p.born > 160 + (p.id % 50) && r() < (plague ? 0.08 : 0.02)) { p.dead = 1; if (p.whisper) this.log(`${p.name} died. They will be remembered.`, `Murió ${p.name}. Se le recordará.`); }
    w.people = w.people.filter((p) => !p.dead);
    // events (the odds)
    if (w.event && w.tick >= w.event.end) { const e = w.event; w.event = null; if (e.k === "fire" && w.obj[e.i]) { w.obj[e.i].k = this.kindFor(w.era, false); this.changed = true; this.log("They rebuilt from the ashes.", "Reconstruyeron sobre las cenizas."); } }
    if (!w.event && (w.tick === 8 || (w.tick > 8 && r() < 0.045))) this.event();
  },
  event() {
    const w = this.w, r = this.r, bs = this.buildings(), y = this.year();
    const pool = ["festival", "fire", "wedding", "storm", "winter", w.era === 0 ? "monster" : "trade", w.era === 2 ? "signal" : "plague", "golden"];
    const k = w.tick === 8 ? "festival" : pick(r, pool), at = pick(r, bs), x = at % N, yy = (at / N) | 0;
    const E = { k, end: w.tick + 8 + Math.floor(r() * 8), x, y: yy, i: at };
    const T2 = {
      festival: ["a festival of lanterns filled the square.", "una fiesta de farolillos llenó la plaza."],
      fire: ["a fire broke out in the town.", "se declaró un incendio en el pueblo."],
      wedding: [`${pick(r, w.people)?.name || "two people"} got married under the trees.`, `${pick(r, w.people)?.name || "dos personas"} se casó bajo los árboles.`],
      storm: ["a storm came from the sea.", "llegó una tormenta."],
      winter: ["a hard winter fell on them.", "cayó un invierno duro."],
      monster: ["something crept out of the old tunnels.", "algo salió de los viejos túneles."],
      trade: ["traders came from another town.", "llegaron comerciantes de otra ciudad."],
      signal: ["a strange signal pulsed in the sky.", "una señal extraña latió en el cielo."],

       *   mood.trains a train passing now and then. mood.places === false leaves all of these out. They all

              g = this.ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 0.4, t + 0.03);
            g.gain.setTargetAtTime(0, t + dur, 0.08);
            for (const d of [-12, 12]) {
              const o = this.osc("square", hz(n), t, t + dur + 0.6);
              o.detune.value = d;
              o.connect(lp);
            }
            lp.connect(g).connect(this.tone);
          }
          guitarra(n, t, dur, vel) {
            // a Portuguese guitar: a bright steel pluck, picked fast (the tremolo) and ringing for the note
            const ring = Math.max(dur, 0.3),
              end = t + ring + 0.6,
              lp = this.lowpass(t, 2800, hz(n) * 3, 0.15, 1);
            this.osc("sawtooth", hz(n), t, end).connect(lp);
            lp.connect(this.trem(t, end, 11, 0.45, this.env(t, vel * 2.2, 0.002, ring + 0.3, this.tone)));
          }
          vox(n, t, dur, vel) {
            // a voice singing "ah" with no words: a sawtooth through two vowel bands, with a singer's vibrato
            const o = this.osc("sawtooth", hz(n), t, t + dur + 0.5),
              vib = this.ctx.createOscillator(),
              depth = this.ctx.createGain(),
              g = this.ctx.createGain();
            o.detune.setValueAtTime(-30, t);
            o.detune.linearRampToValueAtTime(0, t + 0.08);
            vib.frequency.value = 5.5;
            depth.gain.setValueAtTime(0, t);
            depth.gain.linearRampToValueAtTime(25, t + Math.min(dur, 0.5));
            vib.connect(depth).connect(o.detune);
            vib.start(t);
            vib.stop(t + dur + 0.5);
            for (const [f, q] of [
              [700, 5],
              [1150, 6],
            ]) {
              const bp = this.ctx.createBiquadFilter();
              bp.type = "bandpass";
              bp.frequency.value = f;
              bp.Q.value = q;
              o.connect(bp).connect(g);
            }
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 1.6, t + 0.08);
            g.gain.setTargetAtTime(0, t + dur, 0.1);
            g.connect(this.tone);
          }
          twang(n, t, dur, vel) {
            this.plk(n, t, vel * 1.1, "square", 4500, 0.35); // a twangy electric guitar, a Telecaster's
          }
          steel(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.9, "triangle", 0, 0, 0.3, 120, 8, 0); // a pedal steel: a clean string swelling in on the pedal, the bar sliding up (a sawtooth here sounded like a kazoo)
          }
          santur(n, t, dur, vel) {
            this.fm(n, t, Math.min(dur, 0.8), vel * 0.9, 2, 1.5, 0.08); // a hammered zither: the santur
          }
          throat(n, t, dur, vel) {
            // throat singing: a low drone and one of its harmonics whistling above it through a narrow band
            const f = hz(n - 12),
              o = this.osc("sawtooth", f, t, t + dur + 0.5),
              g = this.ctx.createGain();
            for (const [type, freq, q] of [
              ["lowpass", 400, 1],
              ["bandpass", f * 6, 12],
            ]) {
              const flt = this.ctx.createBiquadFilter();
              flt.type = type;
              flt.frequency.value = freq;
              flt.Q.value = q;
              o.connect(flt).connect(g);
            }
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 0.5, t + 0.3);
            g.gain.setTargetAtTime(0, t + dur, 0.06);
            g.connect(this.tone);
          }
          triangle(t, vel) {
            this.ping(4200, t, 0.5, 0.02 * vel);
          }
          scrape(t, vel) {
            this.hit(t, 0.07, "bandpass", 3200, 0.12 * vel, 0.03); // a güira or guacharaca
          }
          // a recorded instrument: its note nearest n, played faster or slower (and through the tape wobble),
          // looped while held when it has a loop. False when the page has no samples for it.
          sample(name, n, t, dur, vel, attack, tail, lp = 0) {
            const notes = samples()[name];
            if (!notes?.length) return false;
            const [root, a, b, data] = notes.reduce((x, y) =>
              Math.abs(y[0] - n) < Math.abs(x[0] - n) ? y : x,
            );
            let bufs = decoded.get(this.ctx);
            if (!bufs) decoded.set(this.ctx, (bufs = {}));
            let buf = bufs[name + root];
            if (!buf) {
              const bytes = atob(data);
              buf = bufs[name + root] = this.ctx.createBuffer(1, bytes.length, 11025);
              const ch = buf.getChannelData(0);
              for (let i = 0; i < bytes.length; i++) ch[i] = ULAW[bytes.charCodeAt(i)];
            }
            const o = this.ctx.createBufferSource(),
              g = this.ctx.createGain();
            o.buffer = buf;
            o.playbackRate.value = 2 ** ((n - root) / 12);
            this.wobble.connect(o.detune);
            if (b) Object.assign(o, { loop: true, loopStart: a / 11025, loopEnd: b / 11025 });
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel, t + attack);
            g.gain.setTargetAtTime(0, t + dur, tail);
            if (lp) {
              const f = this.ctx.createBiquadFilter();
              f.type = "lowpass";
              f.frequency.value = lp;
              f.Q.value = 0;
              o.connect(f).connect(g);
            } else o.connect(g);
            g.connect(this.tone);
            o.start(t);
            o.stop(t + dur + tail * 8);
            return true;
          }
          gaita(n, t, dur, vel) {
            // a recorded bagpipe chanter (FreePats' Bagpipe, CC0), or the synthesized pipes without samples
            if (!this.sample("gaita", n, t, dur, vel * GAITA, 0.02, 0.06)) this.pipes(n, t, dur, vel);
          }
          grand(n, t, dur, vel) {
            // a recorded grand piano, played softly (VCSL's Kawai, CC0): each note rings to its own end
            // whatever its length, through a gentle low-pass; the felt piano without samples
            if (!this.sample("grand", n, t, 2.2, vel * GRAND, 0.004, 0.3, 1600)) this.felt(n, t, dur, vel);
          }
          spanish(n, t, dur, vel) {
            // a recorded Spanish classical guitar (FreePats, CC0) ringing a little past its note, or the nylon
            if (!this.sample("spanish", n, t, dur + 0.4, vel * SPANISH, 0.003, 0.15))
              this.nylon(n, t, dur, vel);
          }
          piano(n, t, dur, vel) {
            this.fm(n, t, dur, vel * 1.3, 1, 3.5, 0.2); // a piano's low notes, struck hard
          }
          gong(t, vel) {
            // a gong: a low tone with an out-of-tune partial, ringing long over a wash of noise
            this.ping(98, t, 2.5, 0.3 * vel);
            this.ping(98 * 2.76, t, 1.5, 0.1 * vel);
            this.hit(t, 1.8, "bandpass", 1200, 0.12 * vel, 0.01);
          }
          bombo(t, vel) {
            // the bass drum of a gaita band, hit with a mallet: rounder and shorter than the big drum
            this.thump(t, 100, 55, 0.08, 0.5 * vel, 0.35);
            this.hit(t, 0.03, "lowpass", 600, 0.15 * vel);
          }
          bigdrum(t, vel) {
            this.thump(t, 85, 38, 0.25, 0.8 * vel, 0.9);
            this.hit(t, 0.25, "lowpass", 300, 0.35 * vel);
          }
        }
        // The whole song as a list of voice calls, [name, ...arguments] with times from the song's start, for
        // a player outside Web Audio (the Android app's native engine, native/lofi.c): play() runs
        // as it does live, but each voice it calls is written down instead of played.
        function score(sheet, nf = {}) {
          const rec = Object.create(Player.prototype),
            out = [];
          for (const name of Object.getOwnPropertyNames(Player.prototype))
            if (!["constructor", "play", "schedule"].includes(name))
              rec[name] = (...args) => out.push([name, ...args.map(Number)]);
          Object.assign(rec, {
            s: sheet,
            loop: LOOPS[sheet.loop] || LOOPS.lazy,
            sd: 60 / sheet.bpm / 4,
            nf,
            cur: 0,
          });
          Object.assign(rec, { step: 0, start: 0, stopAt: Infinity });
          rec.schedule(Infinity);
          return out;
        }
        return {
          song,
          score,
          breathe,
          phaserRate,
          sampleLines,
          reverbIR,
          regionOf,
          Player,
          BANDS,
          KITS,
          STYLES,
          REGIONS,
          OWN_REGIONS,
        };
      })();
    </script>
