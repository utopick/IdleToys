       *   day, crickets on warm nights (mood.warm). mood.crowd (0 to 1) brings voices and traffic hum and
       *   mood.trains a train passing now and then. mood.places === false leaves all of these out. They all
       *   go through a muffled low-pass, like a lo-fi field recording.
       * LOFI.score(sheet, nf) lists every voice call of a sheet, for the Android app's native engine.
       * new LOFI.Player(ctx, destination, sheet, start, fadeIn, nf) plays one sheet through Web Audio; the caller

       * nf switches on four ideas, each on its own ({drift, breathe, swell, phaser}, see drift(), breathe(),

       *   or all false) a song plays its plain score, which a test pins with a fingerprint.
       * The first drum loop, its bass rhythm and the chord hits are TUNE.Pocket's JAM "Lo-fi" loop (lazy beat).
       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of
       *   its leads, another one plays the solo section) and the bass, which drum kit plays the loop (KITS maps
       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in
       *   band, voices, drums, hits and echo, so the Player only follows the sheet.
       * Each song grows from a gene of three moves between scale degrees (sheet.motif). The moves walk the
       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.
       * Melodies: A and B come back as A2 and B2 with their first and third bars kept and a new second bar and
       *   ending, and every song has a four-bar solo. Some songs add a ticking clock (CLICKS) under the drums.
       * To add a band, add a row to BANDS and, if it needs a new sound, write that voice as a Player method
       *   that takes (note, time, duration, velocity), or (time, velocity) for a drum, and plays into this.tone
       *   (chords and leads, which get the echo) or this.bus (bass and drums). Give it at least two leads. Then
       *   render a song with it and set its level so it sounds about as loud as the others; the test checks
       *   that every band turns up and that every voice it names exists.
       * Regional music: mood.region names a style (STYLES), which bends the song towards a place: its scale,
       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a
       *   place's style in OWN_REGIONS and REGIONS. Without a style the dice are thrown exactly as before, so a
       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.
       * This script stands alone (it uses nothing from the main script), so it can be copied into another
       * page as it is: everything it offers is the LOFI object it defines.

        const MOVES = [3, -3, 3, -3, 1, -1, 2, -2];

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";

          let a = seed >>> 0;

            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",

            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],
            mode = MODES[modeName];
          const minorRoll = r() < 0.25 + 0.5 * night,
            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));
          const motif = [pick(MOVES), pick(MOVES), pick(MOVES)];
          let colourName = pick(Object.keys(COLOURS)),
            colour = COLOURS[colourName];
          if (style?.colour)

// ---------- drawing ----------
let clouds = []; for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H, r: 10 + Math.random() * 18, v: 0.6 + Math.random() });

const smoke = [];
function sky() {

// ---------- music: the seed picks a style, the clock picks the mood ----------
const STYLE_POOL = [null, "celtic", "galicia", "japan", "china", "india", "persian", "hijaz", "fado", "country", null];

function startAudio() {

  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
  nextSong(4);
  setInterval(() => { if (!ac) return; const now = ac.currentTime; for (const s of songs) s.schedule(now + 1.5); if (now > songs.at(-1).end - 8) nextSong(8);
    while (songs.length > 1 && songs[0].end < now - 1) songs.shift().dispose(); }, 250);
}
function nextSong(fade) {

  const mood = { night: Math.min(1, sk.dark / 0.6), rain: world.storm > 0 ? 0.6 : 0, wind: 0.3, sea: true, crowd: Math.min(0.6, world.towns.length / 30), trains: world.rails.length > 0 };

  let sheet; try { sheet = LOFI.song((seed + k++ * 7919) >>> 0, mood); } catch (e) { delete mood.region; sheet = LOFI.song((seed + k) >>> 0, mood); }
  const now = ac.currentTime, prev = songs.at(-1);

// ---------- steering ----------
const hud = document.getElementById("hud"); let hudOn = false, hudTimer = 0;
const muteBtn = document.getElementById("mute");
function showHud() {

  document.getElementById("name").textContent = `The ${world.name} people`;
  document.getElementById("stat").textContent = `Year ${world.year} · ${world.towns.length} towns · ${Math.round(popAll())} souls · seed ${seed}`;
  const ul = document.getElementById("log"); ul.textContent = "";
  for (const s of world.log) { const li = document.createElement("li"); li.textContent = s; ul.appendChild(li); }
  muteBtn.textContent = muted ? "Sound: off" : "Sound: on";
  clearTimeout(hudTimer); hudTimer = setTimeout(() => { hudOn = false; hud.classList.remove("on"); }, 7000);
}
cv.addEventListener("pointerdown", (e) => {
  startAudio(); document.getElementById("intro").style.opacity = 0;
  // the canvas keeps its shape (object-fit: contain), so map the tap through the letterbox
  const b = cv.getBoundingClientRect(), k = Math.min(b.width / W, b.height / H);
  const x = Math.floor((e.clientX - b.left - (b.width - W * k) / 2) / k), y = Math.floor((e.clientY - b.top - (b.height - H * k) / 2) / k);
  if (x < 0 || y < 0 || x >= W || y >= H) return showHud();
  const burning = world.towns.find((t) => t.fire > 0 && Math.hypot(t.x - x, t.y - y) < 14);
  if (burning) { burning.fire = 0; world.storm = Math.max(world.storm, 6); chron(`Year ${world.year}: the people of ${burning.name} prayed, and the rain came.`); }
  else if (land(world.t[y * W + x])) { world.beacon = { x, y }; chron(`Year ${world.year}: a beacon is lit. Settlers look towards it.`); }
  showHud();
});
muteBtn.addEventListener("click", () => { muted = !muted; store.set("seedling.mute", muted ? "1" : "0"); startAudio(); if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.2); showHud(); });
document.getElementById("reseed").addEventListener("click", () => { newWorld((Math.random() * 2 ** 32) >>> 0); if (ac) nextSong(3); chime(); showHud(); });

const qs = new URLSearchParams(location.search).get("seed");
newWorld(qs ? Number(qs) || 1 : Number(store.get("seedling.seed")) || (Math.random() * 2 ** 32) >>> 0);
// a seed starts with a few decades already lived, so the first look has a village and a road
for (let i = 0; i < 40; i++) yearTick();
requestAnimationFrame(draw);
setTimeout(() => (document.getElementById("intro").style.opacity = 0), 6000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
