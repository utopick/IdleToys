<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Drive VHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: late-night and wistful, a tape found in a drawer
   IDEA: the ending sequence of a 90s anime, played from a worn VHS
   PICTURE: the whole screen is the night drive, and it follows the song
   COLOUR and TYPE: deep violet night, hot pink sun, sodium-yellow lamps; VT323 as the on-screen display
   LAYOUT: full-bleed scene, OSD text in the corners, one row of big buttons at the bottom */
:root{color-scheme:dark;--bg:#0b0618;--ink:#f4e9ff;--pink:#ff4f9a;--sun:#ffd25a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:20px/1.2 'VT323',ui-monospace,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.osd{position:fixed;font-size:clamp(22px,5vw,34px);text-shadow:2px 0 #ff2d6f,-2px 0 #2de2ff;pointer-events:none;letter-spacing:1px}
#tl{top:max(14px,env(safe-area-inset-top));left:16px}
#tr{top:max(14px,env(safe-area-inset-top));right:16px;text-align:right}
#br{bottom:92px;right:16px}
#hint{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(22px,5.5vw,32px);width:min(90vw,520px);text-shadow:2px 0 #ff2d6f,-2px 0 #2de2ff;pointer-events:none;transition:opacity .6s}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0618d0)}
button,label.btn{flex:1;min-height:56px;border:2px solid var(--ink);background:#1a0f2ecc;color:var(--ink);font:inherit;font-size:22px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4px}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--sun);outline-offset:2px}
button[aria-pressed=true]{background:var(--pink);color:#160822;border-color:var(--pink)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#160822ee;border:2px solid var(--pink);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
body.drop canvas{outline:4px dashed var(--sun);outline-offset:-12px}
</style></head><body>
<canvas id="c" aria-label="A night drive drawn in a 90s anime style that reacts to music"></canvas>
<div class="osd" id="tl">STOP ■</div>
<div class="osd" id="tr">CALM</div>
<div class="osd" id="br"></div>
<div id="hint">Play the demo or pick a song of yours.<br>The drive follows the music: calm, build or rush.</div>
<div class="bar">
<button id="demo" title="Play a demo synthwave song made live in the page">DEMO</button>
<label class="btn" title="Pick an audio file from your device, or drop one on the screen">MY SONG<input type="file" id="file" accept="audio/*"></label>
<button id="stop" title="Stop the music">STOP</button>
<button id="vhs" aria-pressed="true" title="Turn the VHS look on or off">VHS</button>
</div>
<div id="toast" role="status"></div>
<script>
{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),b=buf.getContext('2d');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,c)=>a+Math.random()*(c-a);
let W=0,H=0,w=320,h=200,dpr=1,scan=null,vig=null,city=[];
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.55,p:Math.random()*6}));
const rain=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),v:rnd(.6,1.1)}));

function makeCity(){
  city=[];
  for(let L=0;L<2;L++){
    const arr=[];let x=0;
    while(x<w*2){
      const bw=Math.round(rnd(10,26)*(L?1.2:.8)),bh=Math.round(rnd(.08,.28)*h*(L?1:.75));
      const win=[];
      if(L)for(let yy=3;yy<bh-3;yy+=4)for(let xx=2;xx<bw-2;xx+=4)if(Math.random()<.35)win.push([xx,yy,Math.random()]);
      arr.push({x,bw,bh,win});x+=bw+Math.round(rnd(0,4));
    }
    city.push({arr,len:x});
  }
}
function size(){
  dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*dpr|0;cv.height=H*dpr|0;
  w=W>H?400:240;h=Math.round(w*H/W);buf.width=w;buf.height=h;
  const p=document.createElement('canvas');p.width=1;p.height=Math.max(3,Math.round(3*dpr));
  const pc=p.getContext('2d');pc.fillStyle='rgba(0,0,0,.22)';pc.fillRect(0,0,1,Math.max(1,Math.round(dpr)));
  scan=ctx.createPattern(p,'repeat');
  vig=ctx.createRadialGradient(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*.35,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.55)');
  makeCity();
}

/* ---------- audio ---------- */
let ac=null,an=null,data=null,master=null,audioEl=null,src=null,timer=null,noise=null,playing=false;
function newMaster(){
  if(master){const m=master;m.gain.setTargetAtTime(0,ac.currentTime,.02);setTimeout(()=>m.disconnect(),400);}
  master=ac.createGain();master.gain.value=.8;master.connect(an);
}
function ensureAC(){
  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();
    an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.6;an.connect(ac.destination);
    data=new Uint8Array(an.frequencyBinCount);
    noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    newMaster();
  }
  if(ac.state==='suspended')ac.resume();
}
const mtof=m=>440*2**((m-69)/12);
function tone(type,f,t,d,g,cut,att){
  const o=ac.createOscillator(),a=ac.createGain(),fl=ac.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;
  a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+(att||.01));a.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(fl);fl.connect(a);a.connect(master);o.start(t);o.stop(t+d+.05);
}
function hit(t,ftype,fq,g,d){
  const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),a=ac.createGain();
  s.buffer=noise;fl.type=ftype;fl.frequency.value=fq;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(a);a.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.05);
}
function kick(t,g){
  const o=ac.createOscillator(),a=ac.createGain();
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+.32);
  o.connect(a);a.connect(master);o.start(t);o.stop(t+.35);
}
const BPM=96,STEP=60/BPM/4,CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
let step=0,nextT=0;
function play(s,t){
  const bar=Math.floor(s/16),sec=Math.floor(bar/8)%3,ch=CH[bar%4],pos=s%16;
  if(pos===0)for(const n of ch){tone('sawtooth',mtof(n),t,16*STEP,.035,900,.5);tone('sawtooth',mtof(n)*1.006,t,16*STEP,.035,900,.5);}
  if(sec>=1&&pos%2===0)tone('sawtooth',mtof(ch[0]-24),t,STEP*1.8,.16,450+sec*350);
  if(sec>=1&&pos%4===2)hit(t,'highpass',7000,.12,.05);
  if(sec===1&&(pos===0||pos===8))kick(t,.6);
  if(sec===2){
    if(pos%4===0)kick(t,.95);
    if(pos===4||pos===12)hit(t,'bandpass',1800,.45,.16);
    if(pos%2===1)hit(t,'highpass',8000,.08,.03);
    tone('square',mtof(ch[pos%3]+12),t,STEP*.9,.035,2600);
  }
}
function tick(){while(nextT<ac.currentTime+.12){play(step,nextT);nextT+=STEP;step++;}}
function stopAll(){
  clearInterval(timer);timer=null;
  if(audioEl){audioEl.pause();try{src.disconnect()}catch(e){}URL.revokeObjectURL(audioEl.src);audioEl=null;src=null;}
  if(ac)newMaster();
  setPlaying(false);
}
function startDemo(){
  ensureAC();stopAll();step=0;nextT=ac.currentTime+.1;timer=setInterval(tick,25);
  setPlaying(true);toast('Demo: calm, then build, then rush');
}
function playFile(f){
  if(!f)return;
  if(!(f.type.startsWith('audio')||/\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(f.name))){toast('That is not an audio file');return;}
  ensureAC();stopAll();
  audioEl=new Audio();audioEl.src=URL.createObjectURL(f);
  src=ac.createMediaElementSource(audioEl);src.connect(master);
  audioEl.onended=()=>setPlaying(false);
  audioEl.onerror=()=>{toast('Could not play that file');stopAll();};
  audioEl.play().then(()=>{setPlaying(true);toast('Playing '+(f.name.length>28?f.name.slice(0,26)+'…':f.name));}).catch(()=>toast('Could not play that file'));
}
function setPlaying(on){playing=on;$('hint').style.opacity=on?0:1;resetAnalysis();}

/* ---------- analysis: energy + beats -> mood ---------- */
let bassAvg=0,lastBeat=0,beats=[],lvlS=0,lvlMax=.9,mood=0,pend=0,pendT=0;
function resetAnalysis(){bassAvg=0;beats=[];lvlS=0;lvlMax=.9;if(!playing){mood=0;pend=0;}}
function analyse(now){
  if(!playing||!an)return;
  an.getByteFrequencyData(data);
  let bass=0;for(let i=1;i<6;i++)bass+=data[i];bass/=5*255;
  let all=0;for(let i=1;i<200;i++)all+=data[i];all/=199*255;
  bassAvg+=(bass-bassAvg)*.05;
  if(bass>bassAvg*1.25&&bass>.3&&now-lastBeat>.25){lastBeat=now;beats.push(now);onBeat();}
  beats=beats.filter(x=>now-x<4);
  const lvl=all*1.5+Math.min(1,beats.length/8)*.6;
  lvlS+=(lvl-lvlS)*.02;lvlMax=Math.max(lvlMax*.9995,lvlS);
  const r=lvlS/lvlMax,want=r<.5?0:r<.85?1:2;
  if(want!==mood){if(want!==pend){pend=want;pendT=now;}else if(now-pendT>1.2)mood=want;}else pend=mood;
}

/* ---------- scene ---------- */
let dist=0,speed=.5,calmK=1,rushK=0,pulse=0,shake=0,flash=0,vhsOn=true;
function onBeat(){pulse=1;if(still)return;if(mood>=1)shake=mood*.8;if(mood===2)flash=.22;}
function draw(t,dt){
  const hz=Math.round(h*.58);
  const sky=b.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,'#0d0726');sky.addColorStop(.55,'#3a1658');sky.addColorStop(1,'#ff5c8a');
  b.fillStyle=sky;b.fillRect(0,0,w,hz);
  b.fillStyle='#fff';
  for(const s of stars){b.globalAlpha=(.3+.7*Math.abs(Math.sin(t*.8+s.p)))*(1-rushK*.5);b.fillRect(s.x*w|0,s.y*hz|0,1,1);}
  b.globalAlpha=1;
  // sun with glow and sky-coloured stripes
  const sr=Math.min(w*.32,h*.2)*(1+pulse*.04),sx=w/2,sy=hz-sr*.35;
  const glow=b.createRadialGradient(sx,sy,sr*.6,sx,sy,sr*2);
  glow.addColorStop(0,'rgba(255,80,150,.45)');glow.addColorStop(1,'rgba(255,80,150,0)');
  b.save();b.beginPath();b.rect(0,0,w,hz);b.clip();
  b.fillStyle=glow;b.fillRect(0,0,w,hz);
  const sg=b.createLinearGradient(0,sy-sr,0,sy+sr);sg.addColorStop(0,'#ffe66b');sg.addColorStop(1,'#ff3d8b');
  b.fillStyle=sg;b.beginPath();b.arc(sx,sy,sr,0,7);b.fill();
  b.fillStyle=sky;
  for(let i=0;i<7;i++){const y=sy+sr*(.08+i*.14),th=1+i*.7;b.fillRect(sx-sr,y|0,sr*2,th);}
  b.restore();
  // city, two parallax layers
  city.forEach((L,li)=>{
    const off=(dist*(li?2.2:.9))%L.len;
    b.fillStyle=li?'#160a2a':'#2a1245';
    for(const bd of L.arr)for(const k of [0,L.len]){
      const x=Math.round(bd.x-off+k);if(x>w||x+bd.bw<0)continue;
      b.fillRect(x,hz-bd.bh,bd.bw,bd.bh);
    }
    if(li){
      b.fillStyle='#ffd25a';
      for(const bd of L.arr)for(const k of [0,L.len]){
        const x=Math.round(bd.x-off+k);if(x>w||x+bd.bw<0)continue;
        for(const wn of bd.win){if(Math.sin(t*.3+wn[2]*40)>-.6){b.globalAlpha=.45+.55*wn[2];b.fillRect(x+wn[0],hz-bd.bh+wn[1],1,1);}}
      }
      b.globalAlpha=1;
    }
  });
  // ground, grid, road
  b.fillStyle='#0b0618';b.fillRect(0,hz,w,h-hz);
  b.fillStyle='#ff3df0';
  const ph=dist%1;
  for(let i=0;i<26;i++){const d=i+1-ph,y=hz+(h-hz)/(d*.8);if(y>h)continue;b.globalAlpha=Math.max(.12,1-d/26)*(.55+pulse*.45);b.fillRect(0,y|0,w,1);}
  b.globalAlpha=.55;b.strokeStyle='#ff3df0';b.lineWidth=1;b.beginPath();
  for(let k=-10;k<=10;k++){b.moveTo(w/2,hz);b.lineTo(w/2+k*w*.13,h);}
  b.stroke();b.globalAlpha=1;
  b.fillStyle='#140a24';b.beginPath();b.moveTo(w/2-1,hz);b.lineTo(w/2+1,hz);b.lineTo(w/2+w*.32,h);b.lineTo(w/2-w*.32,h);b.fill();
  b.fillStyle='#ffd25a';
  const dp=(dist*.5)%1;
  for(let i=0;i<14;i++){
    const d1=(i+1-dp)*2,d2=d1+.9,y1=hz+(h-hz)/(d1*.8),y2=hz+(h-hz)/(d2*.8);
    if(y2>h)continue;const ww=Math.max(1,3/d1);b.fillRect(w/2-ww/2,y2,ww,Math.max(1,Math.min(h,y1)-y2));
  }
  // street lamps, far to near
  const lp=(dist/3)%1;
  for(let j=8;j>=0;j--){
    const d=(j+1-lp)*3*.8,base=hz+(h-hz)/d;if(base>h+30)continue;
    const top=base-h*.5/d,off=w*.42/d;
    for(const s of [-1,1]){
      const x=w/2+s*off;
      b.fillStyle='#24163a';b.fillRect(x|0,top,Math.max(1,2/d),base-top);
      const r=Math.max(2,10/d),lg=b.createRadialGradient(x,top,0,x,top,r*2.5);
      lg.addColorStop(0,'rgba(255,214,120,.95)');lg.addColorStop(1,'rgba(255,214,120,0)');
      b.fillStyle=lg;b.fillRect(x-r*2.5,top-r*2.5,r*5,r*5);
    }
  }
  // the car, from behind
  const cw=Math.min(w*.34,h*.5),cx=w/2,cy=h*.86+Math.sin(t*9*speed)*.4-pulse*1.2;
  b.fillStyle='#08040f';b.fillRect(cx-cw*.46,cy+cw*.02,cw*.16,cw*.1);b.fillRect(cx+cw*.3,cy+cw*.02,cw*.16,cw*.1);
  b.fillStyle='#1d1133';b.fillRect(cx-cw*.3,cy-cw*.42,cw*.6,cw*.2);
  b.fillStyle='#3b2a63';b.fillRect(cx-cw*.25,cy-cw*.38,cw*.5,cw*.13);
  b.fillStyle='#24163f';b.fillRect(cx-cw/2,cy-cw*.23,cw,cw*.27);
  b.fillStyle='#ff5ca8';b.fillRect(cx-cw/2,cy-cw*.23,cw,1);
  b.fillStyle='#120a22';b.fillRect(cx-cw*.18,cy-cw*.12,cw*.36,cw*.08);
  const tl=.55+pulse*.45;
  for(const s of [-1,1]){
    const x=cx+s*cw*.36,y=cy-cw*.14;
    const g=b.createRadialGradient(x,y,0,x,y,cw*.25);g.addColorStop(0,`rgba(255,40,80,${.6*tl})`);g.addColorStop(1,'rgba(255,40,80,0)');
    b.fillStyle=g;b.fillRect(x-cw*.25,y-cw*.25,cw*.5,cw*.5);
    b.fillStyle='#ff2a4a';b.fillRect(x-cw*.09,y-cw*.03,cw*.18,cw*.06);
  }
  // rain when calm
  if(calmK>.02){
    b.strokeStyle='#bcd6ff';b.globalAlpha=.35*calmK;b.beginPath();
    for(const r of rain){
      r.y+=r.v*dt*.9;r.x-=r.v*dt*.25;if(r.y>1){r.y-=1;r.x=Math.random()*1.2;}if(r.x<0)r.x+=1.2;
      const x=r.x*w,y=r.y*h;b.moveTo(x,y);b.lineTo(x-1.2,y+4);
    }
    b.stroke();b.globalAlpha=1;
  }
  // anime speed lines when rushing
  if(rushK>.05){
    b.strokeStyle='#ffffff';b.lineWidth=1;b.beginPath();
    const n=still?8:28;
    for(let i=0;i<n;i++){
      if(Math.random()>rushK)continue;
      const a=Math.random()*Math.PI*2,r1=rnd(.3,.45)*w,r2=r1+rnd(.25,.6)*w;
      b.moveTo(w/2+Math.cos(a)*r1,hz+Math.sin(a)*r1);b.lineTo(w/2+Math.cos(a)*r2,hz+Math.sin(a)*r2);
    }
    b.globalAlpha=.5;b.stroke();b.globalAlpha=1;
  }
}
function present(t){
  const X=cv.width,Y=cv.height;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;
  const ox=(Math.random()-.5)*shake*dpr*6,oy=(Math.random()-.5)*shake*dpr*6,wob=vhsOn?Math.sin(t*1.7)*dpr:0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,X,Y);
  ctx.drawImage(buf,ox+wob-shake*dpr*3,oy-shake*dpr*3,X+shake*dpr*6,Y+shake*dpr*6);
  if(vhsOn){
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=.22;
    ctx.drawImage(buf,ox+wob+4*dpr,oy,X,Y);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    const by=((t*.07)%1.4-.2)*Y,bh=Y*.05;
    if(by>0&&by<Y-bh){
      ctx.drawImage(buf,0,by/Y*h,w,bh/Y*h,9*dpr,by,X,bh);
      ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,by,X,bh);
    }
    ctx.fillStyle='rgba(255,255,255,.18)';
    for(let i=0;i<30;i++)ctx.fillRect(Math.random()*X,Math.random()*Y,rnd(2,14)*dpr,dpr);
    ctx.fillStyle=scan;ctx.fillRect(0,0,X,Y);
    ctx.fillStyle=vig;ctx.fillRect(0,0,X,Y);
  }
  if(flash>.01){ctx.fillStyle=`rgba(255,235,255,${flash})`;ctx.fillRect(0,0,X,Y);}
}
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],MOOD=['CALM','BUILD','RUSH'];
let osdSec=-1;
function osd(){
  const d=new Date(),s=d.getSeconds();
  $('tr').textContent=MOOD[mood];
  if(s===osdSec)return;osdSec=s;
  $('tl').textContent=playing?'PLAY ▶':'STOP ■';
  const p=n=>String(n).padStart(2,'0');
  $('br').textContent=`${MON[d.getMonth()]} ${p(d.getDate())} 1994  ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let last=performance.now()/1000;
function frame(ms){
  const t=ms/1000,dt=Math.min(.05,Math.max(0,t-last));last=t;
  analyse(t);
  calmK+=((mood===0?1:0)-calmK)*dt*1.5;rushK+=((mood===2?1:0)-rushK)*dt*1.5;
  speed+=([.5,1.3,2.8][mood]-speed)*dt*1.2;dist+=speed*dt*2;
  pulse*=Math.pow(.02,dt);shake*=Math.pow(.01,dt);flash*=Math.pow(.005,dt);
  draw(t,dt);present(t);osd();
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
let tt=0;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200);}
$('demo').onclick=startDemo;
$('stop').onclick=()=>{stopAll();toast('Stopped');};
$('file').onchange=e=>{playFile(e.target.files[0]);e.target.value='';};
$('vhs').onclick=()=>{vhsOn=!vhsOn;$('vhs').setAttribute('aria-pressed',vhsOn);toast(vhsOn?'VHS on':'VHS off: clean picture');};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop');});
addEventListener('dragleave',()=>document.body.classList.remove('drop'));
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');playFile(e.dataTransfer.files[0]);});
addEventListener('resize',size);
size();requestAnimationFrame(frame);
}
</script>
</body></html>
