       *   or all false) a song plays its plain score, which a test pins with a fingerprint.
       * The first drum loop, its bass rhythm and the chord hits are TUNE.Pocket's JAM "Lo-fi" loop (lazy beat).
       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of
       *   its leads, another one plays the solo section) and the bass, which drum kit plays the loop (KITS maps
       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in
       *   band, voices, drums, hits and echo, so the Player only follows the sheet.
       * Each song grows from a gene of three moves between scale degrees (sheet.motif). The moves walk the
       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.
       * Melodies: A and B come back as A2 and B2 with their first and third bars kept and a new second bar and
       *   ending, and every song has a four-bar solo. Some songs add a ticking clock (CLICKS) under the drums.
       * To add a band, add a row to BANDS and, if it needs a new sound, write that voice as a Player method

       *   render a song with it and set its level so it sounds about as loud as the others; the test checks

       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a
       *   place's style in OWN_REGIONS and REGIONS. Without a style the dice are thrown exactly as before, so a
       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.
       * This script stands alone (it uses nothing from the main script), so it can be copied into another

        // the B section away from A, so the song repeats its own shape at every size, like a fractal.
        const MOVES = [3, -3, 3, -3, 1, -1, 2, -2];

"use strict";
// ===== Drive (r3-opus). One canvas at 640 px wide (480 on a portrait phone), scaled up crisply.
// Sections: setup, art loading and tinting, route and world, light and weather, road renderer, cameras,
// cockpit, effects (rain, snow, wipers), steering, HUD, sound, save. Graphics come only from art/ sheets.
const Q = new URLSearchParams(location.search);
const ES = (navigator.language || "en").toLowerCase().startsWith("es");
const T = (en, es) => (ES ? es : en);
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 640, H = 360, OX = 0; // OX: where the 640-wide cockpit starts (negative on a phone)
function resize() {
  const a = innerWidth / innerHeight;
  W = a < 1 ? 400 : 640;
  H = Math.max(270, Math.round(W / a));
  OX = a < 1 ? -50 : Math.round((W - 640) / 2);
  cv.width = W; cv.height = H;
  g.imageSmoothingEnabled = false;
}
addEventListener("resize", resize); resize();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;

function hash(n) { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }

// ===== Art: art/index.json lists the sheets; a missing sheet draws placeholders and warns once.
const ART = { frames: {}, sheets: {}, anims: {}, spots: {} };
async function loadArt() {
  let list = ["cockpit", "cars", "scenery"];
  try { list = (await (await fetch("art/index.json")).json()).sheets; } catch { console.warn("art/index.json missing"); }
  await Promise.all(list.map(async (name) => {
    try {
      const j = await (await fetch(`art/${name}.json`)).json();
      const img = new Image(); img.src = `art/${name}.png`; await img.decode();
      ART.sheets[name] = { img, tinted: null };
      for (const [k, f] of Object.entries(j.frames || {})) ART.frames[k] = { ...f, sheet: name };
      Object.assign(ART.anims, j.anims || {}); Object.assign(ART.spots, j.spots || {});
    } catch { console.warn(`art sheet ${name} could not load; drawing placeholders`); }
  }));
}
// Each sheet is tinted once per light change (multiply by the ambient colour), so sprites follow the hour.
let tintKey = "";
function retint(amb) {
  const key = amb.map((v) => Math.round(v * 40)).join();
  if (key === tintKey) return; tintKey = key;
  for (const s of Object.values(ART.sheets)) {
    const c = s.tinted || document.createElement("canvas");
    c.width = s.img.width; c.height = s.img.height;
    const x = c.getContext("2d");
    x.globalCompositeOperation = "source-over"; x.clearRect(0, 0, c.width, c.height); x.drawImage(s.img, 0, 0);
    x.globalCompositeOperation = "multiply";

function spr(name, x, y, sc = 1, o = {}) {

  const w = (f ? f.w : 20) * sc, h = (f ? f.h : 20) * sc;
  const dx = x - (f ? f.ax : 10) * sc * (o.flip ? -1 : 1) - (o.flip ? w : 0), dy = y - (f ? f.ay : 20) * sc;

  const src = o.raw ? s.img : s.tinted || s.img;

// drops on the windscreen, swept by the wipers in the rain
function drawGlass(bottom) {
  if (WX.rain <= 0) { FX.drops.length = 0; return; }
  if (FX.drops.length < 140 && Math.random() < WX.rain) FX.drops.push({ x: Math.random() * W, y: Math.random() * bottom, r: 1 + Math.random() * 2.5, t: 0 });
  const wp = (time % 2.2) / 1.1, ang = Math.PI * (wp < 1 ? wp : 2 - wp); // one sweep there and back
  const px = W * 0.5 + OX * 0, py = bottom + 30;
  for (const d of FX.drops) {
    const a = Math.atan2(py - d.y, d.x - px);
    if (Math.abs(a - (Math.PI - ang)) < 0.08) d.dead = 1;
    d.y += d.r > 2.8 ? 0.6 : 0; d.t++;
    g.fillStyle = rgb(mixc(LIGHT.low, [255, 255, 255], 0.4), 0.35); g.fillRect(d.x | 0, d.y | 0, d.r | 0 || 1, (d.r + 1) | 0);
    g.fillStyle = rgb(LIGHT.glow, 0.7); g.fillRect(d.x | 0, d.y | 0, 1, 1);
  }
  FX.drops = FX.drops.filter((d) => !d.dead && d.y < bottom);
  g.strokeStyle = "rgba(10,6,20,0.95)"; g.lineWidth = 3;
  for (const ox of [-W * 0.22, W * 0.12]) { g.beginPath(); g.moveTo(px + ox, py); g.lineTo(px + ox + Math.cos(Math.PI - ang) * W * 0.32, py - Math.sin(Math.PI - ang) * W * 0.32); g.stroke(); }
  g.lineWidth = 1;
}
function drawCockpit() {
  const sp = ART.spots, yb = H - 360;
  const f = ART.frames.cockpit;
  // roof liner above the 640x360 frame on tall screens
  if (!f) { g.fillStyle = "#201830"; g.fillRect(0, yb + 220, W, 140); return; }
  if (yb > 0) { // tall screen: header and mirror at the top, the pillars stretched down to the dashboard
    const s = ART.sheets[f.sheet], src = s.tinted || s.img, R = 70;
    g.drawImage(src, f.x, f.y, f.w, R, OX, 0, f.w, R);
    g.drawImage(src, f.x, f.y + R, f.w, 1, OX, R, f.w, yb);
    g.drawImage(src, f.x, f.y + R, f.w, f.h - R, OX, yb + R, f.w, f.h - R);
  } else spr("cockpit", OX, yb, 1);
  const glow = ART.frames.glow;
  if (glow) { g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.45 + LIGHT.lit * 0.55; g.drawImage(ART.sheets[glow.sheet].img, glow.x, glow.y, glow.w, glow.h, OX, yb, glow.w, glow.h); g.restore(); }
  // needles: speed and revs
  const needle = (s, t, col) => { if (!s) return; const a = Math.PI * (0.75 + 1.5 * t); g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath(); g.moveTo(OX + s.x, yb + s.y); g.lineTo(OX + s.x + Math.cos(a) * s.r * 0.85, yb + s.y + Math.sin(a) * s.r * 0.85); g.stroke(); g.lineWidth = 1; };
  needle(sp.speedo, car.v / 200, "#ff5a3c");
  needle(sp.tacho, clamp(0.15 + car.v / 160 + Math.sin(time * 9) * 0.01 * (car.v > 1), 0, 1), "#ff5a3c");
  // indicator lamps
  const on = car.sig && (time * 2.5) % 1 < 0.5;
  for (const [s, d] of [[sp.indL, -1], [sp.indR, 1]]) if (s && on && car.sig === d) {
    g.fillStyle = "#5cff7a"; g.beginPath(); g.moveTo(OX + s.x + d * 5, yb + s.y); g.lineTo(OX + s.x - d * 3, yb + s.y - 4); g.lineTo(OX + s.x - d * 3, yb + s.y + 4); g.fill();
  }
  // radio display: the station, scrolling
  const r = sp.radio;
  if (r) {
    g.save(); g.beginPath(); g.rect(OX + r.x, yb + r.y, r.w, r.h); g.clip();
    g.fillStyle = "#0a1d1d"; g.fillRect(OX + r.x, yb + r.y, r.w, r.h);
    g.fillStyle = "#ffb04a"; g.font = `${Math.max(6, Math.min(10, r.h - 2))}px monospace`; g.textBaseline = "middle";
    const txt = radioText() + "   ";
    const tw = g.measureText(txt).width, ofs = (time * 14) % tw;
    g.fillText(txt + txt, OX + r.x + 2 - ofs, yb + r.y + r.h / 2 + 0.5);
    g.restore();
  }
}
function drawChase(hz) {
  const s = 2.2, y = H - 18;
  const f = ART.frames.hero_back;
  g.fillStyle = "rgba(0,0,0,0.35)"; g.beginPath(); g.ellipse(W / 2, y, 80, 8, 0, 0, 7); g.fill();
  spr("hero_back", W / 2 + Math.sin(time * 1.3) * 1.5 + (car.x - (car.lane - 1) * LANE) * 0.02, y + (car.v > 1 ? Math.sin(time * 30) * 0.5 : 0), s);
  if (car.sig && (time * 2.5) % 1 < 0.5 && f) { g.fillStyle = "rgba(255,170,40,0.9)"; g.fillRect(W / 2 + car.sig * f.w * s * 0.42 - 6, y - f.h * s * 0.45, 12, 6); }
}
// side camera: the car seen from the roadside, layers sliding past; also the stop scene
function drawSide() {
  const tall = H > W, hz = Math.round(H * (tall ? 0.46 : 0.58)), roadY = Math.round(H * (tall ? 0.68 : 0.84));
  drawSky(hz);
  const sc = car.z * 4;
  drawFar(hz, sc * 0.3);
  // sea in the south or on the coast, fields otherwise
  const coast = where.lat < 38.8 || where.lon > 0.5;
  const gr = g.createLinearGradient(0, hz, 0, roadY);
  if (coast) { gr.addColorStop(0, rgb(mixc(LIGHT.glow, LIGHT.top, 0.3))); gr.addColorStop(1, rgb(LIGHT.top.map((v) => v * 0.7))); }
  else { const c = LIGHT.amb.map((v, i) => v * [150, 140, 95][i]); gr.addColorStop(0, rgb(mixc(c, LIGHT.glow, 0.4))); gr.addColorStop(1, rgb(c.map((v) => v * 0.7))); }
  g.fillStyle = gr; g.fillRect(0, hz, W, roadY - hz);
  if (coast) for (let i = 0; i < 40; i++) { const y = hz + 2 + (i * i) / 9, w = 20 + hash(i) * 60; g.fillStyle = rgb(LIGHT.glow, 0.5 - i / 90); g.fillRect(((W / 2 + (hash(i + 5) - 0.5) * 120 + Math.sin(time + i) * 4) | 0), y | 0, w | 0, 1); }
  // a stop place behind the car when stopped
  if (car.stop) spr(car.stop.place, W * 0.3, roadY - 22, 1.1);
  // roadside props scrolling
  const bio = biome(where, curKm);
  for (let i = 0; i < 8; i++) {
    const x = (((i * 140 - sc * 1.2) % (8 * 140)) + 8 * 140) % (8 * 140) - 100;
    const name = bio === "south" ? "palm" + (i % 3) : bio === "north" ? "pine" + (i % 2) + (WX.snow ? "_snow" : "") : i % 2 ? "lamp" : bio === "city" ? "lamp" : "bush" + (i % 2);
    spr(name, x, roadY - 16, 0.9);
  }
  // road with dashes
  g.fillStyle = rgb(LIGHT.amb.map((v) => v * 55)); g.fillRect(0, roadY - 16, W, H - roadY + 16);
  g.fillStyle = rgb(LIGHT.amb.map((v) => v * 210)); for (let x = -((sc * 3) % 60); x < W; x += 60) g.fillRect(x | 0, roadY + 8, 28, 2);
  if (LIGHT.night > 0.4 || WX.rain) { g.fillStyle = rgb([255, 90, 180], 0.12); g.fillRect(0, roadY - 4, W, 4); }
  const cx = W * 0.55 + (car.stop ? 0 : Math.sin(time * 0.4) * 6), cy = roadY + 4;
  g.fillStyle = "rgba(0,0,0,0.4)"; g.beginPath(); g.ellipse(cx, cy, 84, 5, 0, 0, 7); g.fill();
  spr("hero_side", cx, cy + (car.v > 1 ? Math.sin(time * 25) * 0.4 : 0), 1);
  if (car.stop && car.stop.out) {
    const a = ART.anims.driver, fr = a ? a.frames[Math.floor(time * (a.fps || 0.5)) % a.frames.length] : "driver_lean";
    spr(fr, cx - 100, cy - 2, 1);
    if (car.stop.cat) { const c = ART.anims.cat, cf = c ? c.frames[Math.floor(time * (c.fps || 1)) % c.frames.length] : "cat"; spr(cf, cx - 130, cy - 1, 1); }
    spr("parcel", cx - 60, cy - 1, 1);
  }
  drawWeather(0, roadY);
}

// ===== Cameras: they change by themselves when nobody touches anything.
const CAMS = ["cockpit", "chase", "cockpit", "side"], CAM_T = [32, 20, 40, 22];
let cam = 0, camT = 0, fade = 0;
function camera() { return car.stop ? "side" : Q.get("cam") || CAMS[cam]; }

// ===== Steering: indicators ask for a lane change, the pedal sets the pace, the stop button stops.
function signal(d) {
  car.sig = car.sig === d ? 0 : d; car.sigT = 0; poke();
  toast(d < 0 ? T("Left indicator", "Intermitente izquierdo") : T("Right indicator", "Intermitente derecho"));
}
function pedal() {
  if (car.stop) return go();
  car.pace = car.pace % 3 + 1; save.pace = car.pace; persist(); poke();
  toast([, T("Cruise, 90 km/h", "Crucero, 90 km/h"), T("Top speed, 120 km/h", "Velocidad punta, 120 km/h"), T("Top speed, time runs x10", "Velocidad punta, el tiempo corre x10")][car.pace]);
}
function stopHere(auto) {
  if (car.stop) return go();
  const place = hash(Math.floor(curKm)) < 0.5 || LIGHT.night > 0.5 ? "cafe" : "fuel";
  car.stop = { t: 0, out: false, place, cat: hash(Math.floor(curKm) + 9) < 0.3 + save.deliveries * 0.1, auto, len: auto ? 28 : 1e9 };
  poke(); toast(place === "cafe" ? T("Stopping for a coffee", "Parada para un café") : T("Stopping for fuel", "Parada para repostar"));
}
function go() { car.stop = null; poke(); toast(T("Back on the road", "De vuelta a la carretera")); }
function nextStation() { save.station = save.station ? 0 : 1; persist(); restartMusic(); poke(); toast(radioText()); }
function regionStyle() { return where.lat < 38.6 ? "flamenco" : where.lat > 42.2 && where.lon < -6.5 ? "galicia" : ""; }
function radioText() {
  if (save.station) return T("MIXTAPE  SIDE A  SYNTHWAVE & CITY POP", "CINTA  CARA A  SYNTHWAVE Y CITY POP");
  const st = regionStyle();
  return `FM ${(88 + hash(Math.floor(where.lat * 3)) * 19).toFixed(1)}  ${st === "flamenco" ? "RADIO SUR" : st === "galicia" ? "RADIO NORTE" : "RADIO MESETA"}`;
}

// ===== HUD: fades in on touch, out after a few seconds of nothing.
const hud = document.getElementById("hud");
let lastPoke = -1e9;
function poke() { lastPoke = performance.now(); document.body.classList.add("awake"); }
let toastT = 0;
function toast(s) { const t = document.getElementById("toast"); t.textContent = s; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }
function updateHud() {
  if (performance.now() - lastPoke > 6000) document.body.classList.remove("awake");
  if (!document.body.classList.contains("awake")) return;
  const left = Math.max(0, trip.r.km - curKm), kmh = car.v * WARP[car.pace] || 1;
  const eta = new Date(nowMs() + (left / Math.max(60, PACES[car.pace] * WARP[car.pace] || 90)) * 3600000);
  const hh = (d) => d.toTimeString().slice(0, 5);
  document.getElementById("h-route").textContent = `${trip.from} → ${trip.to}`;
  document.getElementById("h-cargo").textContent = (ES ? trip.cargo[1] : trip.cargo[0]) + (where.road ? `  ·  ${where.road}` : "");
  document.getElementById("h-speed").textContent = `${Math.round(car.v)} km/h${car.pace === 3 && !car.stop ? " ×10" : ""}`;
  document.getElementById("h-left").textContent = `${Math.round(left)} km · ${T("arrive", "llegada")} ${hh(eta)}`;
  document.getElementById("h-time").textContent = hh(new Date(nowMs()));
  document.getElementById("b-pace").textContent = ["", "»", "»»", "»»»"][car.pace];
  document.getElementById("b-stop").textContent = car.stop ? T("GO", "IR") : T("STOP", "PARAR");
  document.getElementById("b-mute").textContent = save.muted ? "🔇" : "♪";
  void kmh;
}

// ===== Sound: the radio (LOFI songs), the engine hum and the indicator click.
let ac = null, master = null, musicBus = null, song = null, engine = null;
function startAudio() {
  if (ac) { if (ac.state !== "running") ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = save.muted ? 0 : 0.8; master.connect(ac.destination);
  musicBus = ac.createGain(); musicBus.gain.value = 0.7; musicBus.connect(master);
  // engine: two detuned saws through a low-pass, level and pitch follow the speed
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
  const eg = ac.createGain(); eg.gain.value = 0; lp.connect(eg); eg.connect(master);
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.type = o2.type = "sawtooth";
  o1.connect(lp); o2.connect(lp); o1.start(); o2.start();
  engine = { o1, o2, eg, lp };
  restartMusic();
}
function restartMusic() {
  if (!ac) return;
  const now = ac.currentTime;
  if (song) { song.fadeOut(now, 2); const old = song; setTimeout(() => old.dispose && old.dispose(), 4000); }
  const mood = { night: LIGHT.night, rain: WX.rain, thunder: WX.code >= 95, wind: WX.snow ? 0.6 : 0.15, sea: where.lat < 38.5, places: true, region: save.station ? "synthwave" : regionStyle() || undefined };
  const sheet = LOFI.song((Math.random() * 1e9) | 0, mood);
  song = new LOFI.Player(ac, musicBus, sheet, now + 0.2, 2);
  song.schedule(now + 1.5);
}
function tickAudio() {
  if (!ac || !song) return;
  const now = ac.currentTime;
  song.schedule(now + 1.5);
  if (song.end && song.end < now + 3) restartMusic();
  const v = car.v / 120;
  engine.o1.frequency.setTargetAtTime(38 + v * 60, now, 0.3); engine.o2.frequency.setTargetAtTime(38.7 + v * 61, now, 0.3);
  engine.eg.gain.setTargetAtTime(camera() === "cockpit" ? 0.05 + v * 0.05 : 0.025 + v * 0.03, now, 0.5);
}
let lastTick = 0;
function tickClick() {
  if (!ac || !car.sig) return;
  const ph = Math.floor(time * 5);
  if (ph === lastTick) return; lastTick = ph;
  const b = ac.createBuffer(1, 600, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < 600; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / 60) * 0.5;
  const s = ac.createBufferSource(), gg = ac.createGain(); gg.gain.value = ph % 2 ? 0.25 : 0.4; s.buffer = b; s.connect(gg); gg.connect(master); s.start();
}

// ===== Main loop
let time = 0, frame = 0, last = performance.now(), where = { lat: 40.4, lon: -3.7, road: "" }, curKm = 0, PLACES = [], lightT = -1e9, wxT = -1e9, saveT = 0;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function step(dt) {
  time += dt;
  // speed: eases to the pace, or to zero for a stop or a jam
  let target = car.stop ? 0 : PACES[car.pace];
  const ahead = traffic.filter((c) => c.lane === car.lane && c.z > car.z && c.z - car.z < 14);
  if (ahead.length && !car.stop) {
    const free = [car.lane - 1, car.lane + 1].filter((l) => l >= 0 && l < 3 && !traffic.some((c) => c.lane === l && Math.abs(c.z - car.z) < 12));
    if (free.length && !car.sig) { car.sig = free[0] - car.lane; car.sigT = 0; car.auto = 1; } // the car signals by itself
    target = Math.min(target, ahead[0].v);
  }
  car.v += (target - car.v) * Math.min(1, dt * (target < car.v ? 0.8 : 0.35));
  if (car.v < 0.5 && car.stop) { car.v = 0; car.stop.t += dt; if (car.stop.t > 1.2) car.stop.out = true; if (car.stop.t > car.stop.len) go(); }
  // indicators: change lane when free, after a couple of blinks
  if (car.sig) {
    car.sigT += dt;
    const nl = car.lane + car.sig;
    if (nl < 0 || nl > 2) { if (car.sigT > 2.5) car.sig = 0; }
    else if (car.sigT > 1.4 && !traffic.some((c) => c.lane === nl && Math.abs(c.z - car.z) < 10)) { car.lane = nl; }
    if (car.sigT > 3.2 && Math.abs(car.x - (car.lane - 1) * LANE) < 60) { car.sig = 0; car.auto = 0; }
  }
  car.x += ((car.lane - 1) * LANE - car.x) * Math.min(1, dt * 1.2);
  const segPerS = car.v / 3.6 / 2;
  car.z += segPerS * dt;
  for (const c of traffic) c.z += c.v / 3.6 / 2 * dt;
  traffic = traffic.filter((c) => c.z > car.z - 4 && c.z < car.z + 900);
  if (traffic.length < 9) spawnTraffic(1);
  // progress on the real route: real km at real time, x10 at the third pace
  save.km += (car.v * WARP[car.pace] * dt) / 3600;
  if (save.km >= trip.r.km) { // delivered: next job
    save.deliveries++; save.job = (save.job + 1) % JOBS.length; save.km = 0; persist(); startTrip(); PLACES = placesOnTrip();
    toast(T(`Delivered! ${save.deliveries} so far`, `¡Entregado! Llevas ${save.deliveries}`)); poke();
  }
  curKm = save.km; where = whereAt(curKm);
  if (time - lightT > 5) { lightT = time; updateLight(where); }
  if (time - wxT > 1800) { wxT = time; fetchWeather(where).then(() => updateLight(where)); }
  if ((saveT += dt) > 10) { saveT = 0; persist(); }
  // idle life: cameras change by themselves; a coffee stop on its own now and then
  const idle = performance.now() - lastPoke > 20000;
  camT += dt;
  if (idle && !car.stop && camT > CAM_T[cam]) { camT = 0; cam = (cam + 1) % CAMS.length; fade = 1; }
  if (idle && !car.stop && Math.floor(time) % 420 === 150 && Math.floor(time - dt) % 420 !== 150) stopHere(true);
}
function render() {
  const c = camera();
  if (c === "side") drawSide();
  else {
    const inside = c === "cockpit";
    const yb = H - 360, hz = inside ? yb + (ART.spots.windscreenBottom ?? 210) - 66 : Math.round(H * 0.5);
    drawSky(hz);
    drawFar(hz, car.z * 2 + where.hd * 100);
    const camX = car.x + Math.sin(time * 0.7) * 10;
    drawRoad(hz, camX, inside ? 900 : 1500, W / 2 + (inside ? OX + 320 - W / 2 + 20 : 0));
    drawWeather(0, hz + 60);
    if (inside) { drawGlass(yb + (ART.spots.windscreenBottom ?? 210)); drawCockpit(); }
    else drawChase(hz);
  }
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); fade = Math.max(0, fade - 0.04); }
  // a soft vignette and scanlines, the CRT feel
  if (!reduced) { g.fillStyle = "rgba(0,0,0,0.12)"; for (let y = 0; y < H; y += 2) g.fillRect(0, y, W, 1); }
}
function loop(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t; frame++;
  step(dt); render(); tickAudio(); tickClick(); updateHud();
  requestAnimationFrame(loop);
}

// ===== Input: taps on pointerup/click only (phones), buttons in the HUD, keys too.
const act = { left: () => signal(-1), right: () => signal(1), pace: pedal, stop: () => stopHere(false), radio: nextStation,
  mute: () => { save.muted = !save.muted; persist(); if (master) master.gain.value = save.muted ? 0 : 0.8; toast(save.muted ? T("Sound off", "Sonido apagado") : T("Sound on", "Sonido encendido")); } };
document.addEventListener("click", (e) => {
  startAudio();
  document.getElementById("hint").classList.add("gone");
  const b = e.target.closest("[data-a]");
  if (b) act[b.dataset.a]();
  else {
    // a tap on the radio in the cockpit changes station; anywhere else wakes the HUD
    const r = cv.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H, s = ART.spots.radio;
    if (s && camera() === "cockpit" && x > OX + s.x - 10 && x < OX + s.x + s.w + 10 && y > H - 360 + s.y - 10 && y < H - 360 + s.y + s.h + 10) nextStation();
    else poke();
  }
});
addEventListener("keydown", (e) => {
  const k = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "pace", " ": "stop", r: "radio", m: "mute" }[e.key];
  if (k) { startAudio(); act[k](); e.preventDefault(); } else poke();
});
document.getElementById("hint").textContent = T("Tap to start the radio", "Toca para encender la radio");
for (const [id, en, es] of [["b-left", "Left indicator", "Intermitente izquierdo"], ["b-right", "Right indicator", "Intermitente derecho"], ["b-pace", "Pedal: pace", "Pedal: ritmo"], ["b-stop", "Stop / go", "Parar / seguir"], ["b-radio", "Radio station", "Emisora"], ["b-mute", "Sound on/off", "Sonido sí/no"]]) document.getElementById(id).title = T(en, es);
document.getElementById("b-radio").textContent = T("RADIO", "RADIO");

(async () => {
  await loadArt();
  // catch up with the real time spent away (the trip went on at cruise speed, capped at the route)
  startTrip();
  const away = clamp((Date.now() - (+save.t || Date.now())) / 3600000, 0, 24);
  save.km = Math.min(trip.r.km - 1, save.km + away * 90);
  PLACES = placesOnTrip(); curKm = save.km; where = whereAt(curKm);
  applyCode(0); updateLight(where); fetchWeather(where).then(() => updateLight(where)); wxT = 0;
  spawnTraffic(8);
  if (Q.get("stop")) stopHere(false);
  requestAnimationFrame((t) => { last = t; loop(t); });
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
addEventListener("pagehide", persist);
</script>
