<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120818">
<title>Night Drive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #07040c; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body { font: 600 14px/1.2 ui-monospace, Menlo, Consolas, monospace; color: #ffe3f1; }
  #stage { position: fixed; inset: 0; display: flex; justify-content: center; }
  canvas { width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
  /* CRT: scanlines, a soft glow and a dark rim */
  #crt { position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); mix-blend-mode: multiply; }
  #hud, #pad { position: fixed; left: 0; right: 0; transition: opacity 1.2s; opacity: 0; pointer-events: none; }
  body.awake #hud, body.awake #pad { opacity: 1; }
  body.awake #pad { pointer-events: auto; }
  #hud { top: max(14px, env(safe-area-inset-top)); text-align: center; text-shadow: 0 0 6px #ff3fa4, 0 0 2px #000; letter-spacing: .06em; }
  #hud b { display: block; font-size: 34px; color: #7ff6ff; text-shadow: 0 0 8px #19d3ff, 0 0 2px #000; }
  #hud .r { color: #ffd36b; margin: 4px 0; }
  #pad { bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 14px; max-width: 900px; margin: 0 auto; }
  @media (min-aspect-ratio: 1/1) { #pad { grid-template-columns: repeat(8, 1fr); } #hud b { font-size: 48px; } body { font-size: 18px; } }
  #pad button { height: 64px; border-radius: 10px; border: 2px solid #ff4fae; background: rgba(20,6,30,.72); color: #ffe3f1;
    font: inherit; font-size: 15px; letter-spacing: .05em; box-shadow: 0 0 10px rgba(255,79,174,.45) inset; }
  #pad button:active { background: rgba(255,79,174,.35); }
  #pad button.on { border-color: #ffd36b; color: #ffd36b; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 10px 16px; background: rgba(14,4,22,.85);
    border: 1px solid #7ff6ff; border-radius: 8px; color: #7ff6ff; opacity: 0; transition: opacity .5s; pointer-events: none; text-align: center; max-width: 80vw; }
  #toast.show { opacity: 1; }
  #hint { position: fixed; bottom: 30%; width: 100%; text-align: center; color: #ffb3dc; text-shadow: 0 0 6px #000; animation: blink 2s infinite; pointer-events: none; }
  @keyframes blink { 50% { opacity: .35; } }
</style>
</head>

<div id="crt"></div>

  <button id="bR" title="Signal right: the driver changes lane">SIGNAL ▶</button>

  <button id="bRoute" title="Pick the next city">ROUTE</button>
  <button id="bCam" title="Change the camera">CAMERA</button>
  <button id="bMute" title="Music on or off">♪ ON</button>
</div>

       * LOFI.song(seed, mood) writes a song "sheet" from a number; it is pure and tests/music.test.js checks it.

       *   minor keys, slower, darker. Rain plays a hiss, a low wash and drops on the window; thunder adds

       *   mood.trains a train passing now and then. mood.places === false leaves all of these out. They all
       *   go through a muffled low-pass, like a lo-fi field recording.
       * LOFI.score(sheet, nf) lists every voice call of a sheet, for the Android app's native engine.
       * new LOFI.Player(ctx, destination, sheet, start, fadeIn, nf) plays one sheet through Web Audio; the caller

       * nf switches on four ideas, each on its own ({drift, breathe, swell, phaser}, see drift(), breathe(),
       *   swellAt and PH_HZ): they change how a sheet is played, never the sheet, and without them (nf left out
       *   or all false) a song plays its plain score, which a test pins with a fingerprint.
       * The first drum loop, its bass rhythm and the chord hits are TUNE.Pocket's JAM "Lo-fi" loop (lazy beat).
       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of
       *   its leads, another one plays the solo section) and the bass, which drum kit plays the loop (KITS maps
       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in
       *   band, voices, drums, hits and echo, so the Player only follows the sheet.
       * Each song grows from a gene of three moves between scale degrees (sheet.motif). The moves walk the
       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.
       * Melodies: A and B come back as A2 and B2 with their first and third bars kept and a new second bar and
       *   ending, and every song has a four-bar solo. Some songs add a ticking clock (CLICKS) under the drums.
       * To add a band, add a row to BANDS and, if it needs a new sound, write that voice as a Player method
       *   that takes (note, time, duration, velocity), or (time, velocity) for a drum, and plays into this.tone
       *   (chords and leads, which get the echo) or this.bus (bass and drums). Give it at least two leads. Then
       *   render a song with it and set its level so it sounds about as loud as the others; the test checks
       *   that every band turns up and that every voice it names exists.
       * Regional music: mood.region names a style (STYLES), which bends the song towards a place: its scale,
       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a
       *   place's style in OWN_REGIONS and REGIONS. Without a style the dice are thrown exactly as before, so a
       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.
       * This script stands alone (it uses nothing from the main script), so it can be copied into another
       * page as it is: everything it offers is the LOFI object it defines.
       */
      const LOFI = (() => {

        const BANDS = {

            leads: ["flute", "bell", "keys"],

            drums: "kit",

          },

          rhodes: {

            leads: ["guitar", "whistle"],

            drums: "kit",
            loops: ["lazy", "sway"],
            echo: [0.18, 3, 0.35],
            level: 0.85,
          },
          kalimba: {
            chords: "wurli",
            leads: ["kalimba", "musicbox"],
            bass: "bass",
            drums: "snap",

            echo: [0.3, 3, 0.45],
            level: 1.15,

            leads: ["marimba", "kalimba"],

            leads: ["musicbox", "whistle"],

          MINOR = [0, 2, 3, 5, 7, 8, 10];
        // The song's gene: three moves between scale degrees (fourths and fifths twice as likely as steps
        // and thirds). The same three moves walk the melody inside a bar, the chords inside a section, and
        // the B section away from A, so the song repeats its own shape at every size, like a fractal.
        const MOVES = [3, -3, 3, -3, 1, -1, 2, -2];
        const STARTS = [0, 0, 1, 3, 5]; // loops start on I, ii, IV or vi
        // chord colours, as scale degrees stacked over the chord's root
        const COLOURS = {

          seventh: [0, 2, 4, 6],
          add9: [0, 2, 4, 8],
          sus: [0, 1, 4, 7], // 1-2-5-8

        // what plays in each section; mel* and solo name the melody (A2 and B2 are A and B coming back changed)

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";

          let a = seed >>> 0;

            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",
            style = STYLES[styleName],
            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],
            mode = MODES[modeName];
          const minorRoll = r() < 0.25 + 0.5 * night,
            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));
          const motif = [pick(MOVES), pick(MOVES), pick(MOVES)];
          let colourName = pick(Object.keys(COLOURS)),
            colour = COLOURS[colourName];

          }
          guitar(n, t, dur, vel) {
            // a clean jazz guitar, played with the thumb: a dark pluck that rings for the note
            const lp = this.lowpass(t, 1600, hz(n) * 2, 0.15, 0.8);
            this.osc("triangle", hz(n), t, t + dur + 1).connect(lp);
            this.osc("sawtooth", hz(n), t, t + dur + 1).connect(this.env(t, 0.25, 0.002, 0.3, lp));
            lp.connect(this.env(t, vel * 1.2, 0.003, Math.min(dur, 0.8) + 0.4, this.tone));
          }
          whistle(n, t, dur, vel) {
            // a theremin-like voice, low and singing: a sine that glides up into the note, with a slow, wide
            // vibrato that comes in late (it was a whistle an octave up, too bright for lo-fi)
            this.wind(n - 12, t, dur, vel * 0.6, "sine", 0, 0, 0.12, 40, 16, 0.006);
          }
          // a plucked string: a bright attack whose low-pass closes fast, then a short ring
          plk(n, t, vel, type, bright, ring) {
            const lp = this.lowpass(t, bright, hz(n) * 1.5, 0.06, 1);
            this.osc(type, hz(n), t, t + ring * 5 + 0.1).connect(lp);
            lp.connect(this.env(t, vel, 0.002, ring * 4, this.tone));
          }
          pluck(n, t, dur, vel) {
            this.plk(n - 12, t, vel * 0.9, "square", 1400, 0.3); // an octave down, darker
          }
          nylon(n, t, dur, vel) {
            this.plk(n, t, vel * 1.4, "sawtooth", 2200, 0.6);
          }
          upright(n, t, dur) {
            // a plucked upright: a sawtooth whose low-pass closes right after the pluck
            const lp = this.lowpass(t, 1100, 220, 0.08);
            this.osc("sawtooth", hz(n), t, t + dur + 0.8).connect(lp);
            lp.connect(this.env(t, 0.6, 0.004, Math.min(dur, 0.5) + 0.4));
          }
          bass(n, t, dur) {
            const lp = this.ctx.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 380;
            this.osc("triangle", hz(n), t, t + dur + 0.3)
              .connect(lp)
              .connect(this.env(t, 0.5, 0.01, dur));
          }
          sub(n, t, dur) {
            // a round sine sub bass, an octave low
            this.osc("sine", hz(n), t, t + dur + 0.3).connect(this.env(t, 0.6, 0.015, dur));
          }
          kick(t, vel) {
            const o = this.ctx.createOscillator();
            o.frequency.setValueAtTime(110, t);
            o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
            o.connect(this.env(t, 0.85 * vel, 0.003, 0.35));
            o.start(t);
            o.stop(t + 0.5);
          }
          hit(t, dur, type, freq, vel, attack = 0.002) {
            const src = this.ctx.createBufferSource(),
              f = this.ctx.createBiquadFilter();
            src.buffer = kit(this.ctx).noise;
            f.type = type;
            f.frequency.value = freq;
            src.connect(f).connect(this.env(t, vel, attack, dur));
            src.start(t, Math.random() * 1.5, dur + attack + 0.1);
          }
          ping(f, t, dur, vel, type = "sine") {
            this.osc(type, f, t, t + dur + 0.05).connect(this.env(t, vel, 0.001, dur));
          }
          // drum voices: (time, velocity about 1); KITS says which row plays which
          snare(t, vel) {
            this.hit(t, 0.18, "bandpass", 1700, 0.32 * vel);
          }
          hat(t, vel) {
            this.hit(t, 0.04, "highpass", 7000, 0.09 * vel);
          }
          open(t, vel) {
            this.hit(t, 0.22, "highpass", 6000, 0.06 * vel);
          }
          softKick(t, vel) {
            this.kick(t, 0.6 * vel);
          }
          brush(t, vel) {
            this.hit(t, 0.3, "bandpass", 2800, 0.2 * vel, 0.03);
          }
          ride(t, vel) {
            this.hit(t, 0.5, "bandpass", 7500, 0.08 * vel);
            this.ping(3700, t, 0.3, 0.012 * vel, "square");
          }
          tick(t, vel) {
            this.ping(2400, t, 0.02, 0.2 * vel);
          }
          tock(t, vel) {
            this.ping(1500, t, 0.03, 0.25 * vel);
          }
          rim(t, vel) {
            this.hit(t, 0.03, "bandpass", 2200, 0.35 * vel);
            this.ping(1800, t, 0.015, 0.06 * vel, "square");
          }
          clap(t, vel) {
            // a lo-fi clap: three quick bursts of band-passed noise, then the tail
            for (const d of [0, 0.011, 0.022]) this.hit(t + d, 0.02, "bandpass", 1200, 0.18 * vel);
            this.hit(t + 0.03, 0.15, "bandpass", 1100, 0.14 * vel);
          }
          shaker(t, vel) {
            this.hit(t, 0.07, "highpass", 5500, 0.08 * vel, 0.015);
          }
          // ---- the voices of regional styles (STYLES) and of the kaiju song ----
          // a wind or bowed lead: a wave that scoops up into the note (scoop cents, over the attack), through
          // a band-pass for the instrument's body (none when bp is 0), with a vibrato of vib cents that comes in
          // late and a breath of noise
          wind(n, t, dur, vel, type, bp, q, attack, scoop, vib, breath) {
            const o = this.osc(type, hz(n), t, t + dur + 0.5),
              g = this.ctx.createGain();
            o.detune.setValueAtTime(-scoop, t);
            o.detune.linearRampToValueAtTime(0, t + attack);
            if (vib) {
              const lfo = this.ctx.createOscillator(),
                depth = this.ctx.createGain();
              lfo.frequency.value = 5.5;
              depth.gain.setValueAtTime(0, t);
              depth.gain.linearRampToValueAtTime(vib, t + Math.min(dur, 0.5));
              lfo.connect(depth).connect(o.detune);
              lfo.start(t);
              lfo.stop(t + dur + 0.5);
            }
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel, t + attack);
            g.gain.setTargetAtTime(0, t + dur, 0.06);
            g.connect(this.tone);
            if (bp) {
              const f = this.ctx.createBiquadFilter();
              f.type = "bandpass";
              f.frequency.value = bp;
              f.Q.value = q;
              o.connect(f).connect(g);
            } else o.connect(g);
            if (breath) this.hit(t, Math.min(dur, 0.5), "bandpass", hz(n) * 2, breath, attack);
          }
          bowed(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.9, "sawtooth", 1400, 1.2, 0.12, 40, 22, 0); // an erhu or a fiddle
          }
          reed(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.7, "square", 1300, 2.5, 0.06, 25, 12, 0); // a dulzaina, zurna or shawm
          }
          sax(n, t, dur, vel) {
            this.wind(n - 12, t, dur, vel * 0.9, "sawtooth", 1000, 0.9, 0.04, 30, 15, 0.01); // a tenor sax
          }
          pipes(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.9, "sawtooth", 1600, 1.8, 0.01, 0, 0, 0); // a bagpipe chanter, steady
          }
          fife(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.8, "triangle", 0, 0, 0.07, 0, 10, 0.01); // a tin whistle
          }
          shaku(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.9, "sine", 0, 0, 0.1, 60, 15, 0.03); // a shakuhachi, ney or bansuri
          }
          drone(n, t, dur, vel) {
            this.wind(n, t, dur, vel, "sawtooth", 700, 0.8, 0.3, 0, 0, 0); // a bagpipe's drones or a tanpura
          }
          plucked(n, t, dur, vel) {
            this.plk(n, t, vel * 1.3, "sawtooth", 2600, 0.45); // a guitar, an oud, a saz
          }
          zither(n, t, dur, vel) {
            this.plk(n, t, vel * 1.2, "triangle", 4000, 0.9); // a koto, a guzheng, a kora
          }
          riff(n, t, dur, vel) {
            // a synth riff whose low-pass is brighter the harder it is played
            this.plk(n, t, vel, "sawtooth", 300 + 20000 * vel * vel, 0.25);
          }
          // low brass, an octave down: two sawtooths whose low-pass opens as the note speaks
          brass(n, t, dur, vel) {
            const lp = this.lowpass(t, 250, 1500, 0.08, 1),
              g = this.ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 0.9, t + 0.06);
            g.gain.setTargetAtTime(vel * 0.6, t + 0.06, 0.3);
            g.gain.setTargetAtTime(0, t + dur, 0.1);
            for (const d of [-6, 6]) {
              const o = this.osc("sawtooth", hz(n - 12), t, t + dur + 0.6);
              o.detune.value = d;
              o.connect(lp);
            }
            lp.connect(g).connect(this.tone);
          }
          // low strings, played hard and short (marcato)
          strings(n, t, dur, vel) {
            const lp = this.lowpass(t, 900, 900, 1, 0.5),
              g = this.ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel, t + 0.03);
            g.gain.setTargetAtTime(vel * 0.6, t + 0.03, 0.15);
            g.gain.setTargetAtTime(0, t + dur, 0.08);
            for (const d of [-10, 10]) {
              const o = this.osc("sawtooth", hz(n), t, t + dur + 0.5);
              o.detune.value = d;
              o.connect(lp);
            }
            lp.connect(g).connect(this.bus);
          }
          timpani(n, t, dur) {
            this.osc("sine", hz(n + 12), t, t + 2).connect(this.env(t, 0.4, 0.004, 1.4));
            this.hit(t, 0.12, "lowpass", 600, 0.25);
          }
          // a drum skin: a sine that falls from one pitch to another
          thump(t, from, to, drop, vel, decay) {
            const o = this.ctx.createOscillator();
            o.frequency.setValueAtTime(from, t);
            o.frequency.exponentialRampToValueAtTime(to, t + drop);
            o.connect(this.env(t, vel, 0.003, decay));
            o.start(t);
            o.stop(t + decay * 1.5 + 0.1);
          }
          frame(t, vel) {
            // a frame drum: the bodhrán, the daf
            this.thump(t, 110, 65, 0.08, 0.3 * vel, 0.3);
            this.hit(t, 0.05, "bandpass", 800, 0.08 * vel);
          }
          goblet(t, vel) {
            // a high, tight drum with a slap: the darbuka, the tabla, the djembe
            this.thump(t, 330, 260, 0.04, 0.3 * vel, 0.15);
            this.hit(t, 0.03, "highpass", 3000, 0.12 * vel);
          }
          taiko(t, vel) {
            this.thump(t, 140, 70, 0.1, 0.4 * vel, 0.4);
            this.hit(t, 0.1, "bandpass", 500, 0.1 * vel);
          }
          jingles(t, vel) {
            // a tambourine's jingles: the pandeireta, the pandeiro
            this.hit(t, 0.2, "highpass", 7500, 0.08 * vel, 0.004);
            this.hit(t + 0.025, 0.12, "highpass", 9000, 0.05 * vel);
          }
          castanets(t, vel) {
            this.hit(t, 0.015, "bandpass", 3500, 0.3 * vel);
            this.hit(t + 0.028, 0.015, "bandpass", 3800, 0.22 * vel);
          }
          palmas(t, vel) {
            // flamenco hand claps: brighter and drier than the lo-fi clap
            for (const d of [0, 0.007, 0.014]) this.hit(t + d, 0.015, "bandpass", 2000, 0.14 * vel);
            this.hit(t + 0.02, 0.09, "bandpass", 1700, 0.1 * vel);
          }
          tamboril(t, vel) {
            // a small drum with a snare: the tamboril, a march's side drum
            this.hit(t, 0.12, "bandpass", 2300, 0.26 * vel);
            this.thump(t, 260, 220, 0.03, 0.18 * vel, 0.1);
          }
          accordion(n, t, dur, vel) {
            // an accordion or a bandoneón: two reeds a little out of tune with each other (the musette's beat)
            const lp = this.lowpass(t, 1300, 1300, 1, 0.7),
              g = this.ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 0.4, t + 0.03);
            g.gain.setTargetAtTime(0, t + dur, 0.08);
            for (const d of [-12, 12]) {
              const o = this.osc("square", hz(n), t, t + dur + 0.6);
              o.detune.value = d;
              o.connect(lp);
            }
            lp.connect(g).connect(this.tone);
          }
          guitarra(n, t, dur, vel) {
            // a Portuguese guitar: a bright steel pluck, picked fast (the tremolo) and ringing for the note
            const ring = Math.max(dur, 0.3),
              end = t + ring + 0.6,
              lp = this.lowpass(t, 2800, hz(n) * 3, 0.15, 1);
            this.osc("sawtooth", hz(n), t, end).connect(lp);
            lp.connect(this.trem(t, end, 11, 0.45, this.env(t, vel * 2.2, 0.002, ring + 0.3, this.tone)));
          }
          vox(n, t, dur, vel) {
            // a voice singing "ah" with no words: a sawtooth through two vowel bands, with a singer's vibrato
            const o = this.osc("sawtooth", hz(n), t, t + dur + 0.5),
              vib = this.ctx.createOscillator(),
              depth = this.ctx.createGain(),
              g = this.ctx.createGain();
            o.detune.setValueAtTime(-30, t);
            o.detune.linearRampToValueAtTime(0, t + 0.08);
            vib.frequency.value = 5.5;
            depth.gain.setValueAtTime(0, t);
            depth.gain.linearRampToValueAtTime(25, t + Math.min(dur, 0.5));
            vib.connect(depth).connect(o.detune);
            vib.start(t);
            vib.stop(t + dur + 0.5);
            for (const [f, q] of [
              [700, 5],
              [1150, 6],
            ]) {
              const bp = this.ctx.createBiquadFilter();
              bp.type = "bandpass";
              bp.frequency.value = f;
              bp.Q.value = q;
              o.connect(bp).connect(g);
            }
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 1.6, t + 0.08);
            g.gain.setTargetAtTime(0, t + dur, 0.1);
            g.connect(this.tone);
          }
          twang(n, t, dur, vel) {
            this.plk(n, t, vel * 1.1, "square", 4500, 0.35); // a twangy electric guitar, a Telecaster's
          }
          steel(n, t, dur, vel) {
            this.wind(n, t, dur, vel * 0.9, "triangle", 0, 0, 0.3, 120, 8, 0); // a pedal steel: a clean string swelling in on the pedal, the bar sliding up (a sawtooth here sounded like a kazoo)
          }
          santur(n, t, dur, vel) {
            this.fm(n, t, Math.min(dur, 0.8), vel * 0.9, 2, 1.5, 0.08); // a hammered zither: the santur
          }
          throat(n, t, dur, vel) {
            // throat singing: a low drone and one of its harmonics whistling above it through a narrow band
            const f = hz(n - 12),
              o = this.osc("sawtooth", f, t, t + dur + 0.5),
              g = this.ctx.createGain();
            for (const [type, freq, q] of [
              ["lowpass", 400, 1],
              ["bandpass", f * 6, 12],
            ]) {
              const flt = this.ctx.createBiquadFilter();
              flt.type = type;
              flt.frequency.value = freq;
              flt.Q.value = q;
              o.connect(flt).connect(g);
            }
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel * 0.5, t + 0.3);
            g.gain.setTargetAtTime(0, t + dur, 0.06);
            g.connect(this.tone);
          }
          triangle(t, vel) {
            this.ping(4200, t, 0.5, 0.02 * vel);
          }
          scrape(t, vel) {
            this.hit(t, 0.07, "bandpass", 3200, 0.12 * vel, 0.03); // a güira or guacharaca
          }
          // a recorded instrument: its note nearest n, played faster or slower (and through the tape wobble),
          // looped while held when it has a loop. False when the page has no samples for it.
          sample(name, n, t, dur, vel, attack, tail, lp = 0) {
            const notes = samples()[name];
            if (!notes?.length) return false;
            const [root, a, b, data] = notes.reduce((x, y) =>
              Math.abs(y[0] - n) < Math.abs(x[0] - n) ? y : x,
            );
            let bufs = decoded.get(this.ctx);
            if (!bufs) decoded.set(this.ctx, (bufs = {}));
            let buf = bufs[name + root];
            if (!buf) {
              const bytes = atob(data);
              buf = bufs[name + root] = this.ctx.createBuffer(1, bytes.length, 11025);
              const ch = buf.getChannelData(0);
              for (let i = 0; i < bytes.length; i++) ch[i] = ULAW[bytes.charCodeAt(i)];
            }
            const o = this.ctx.createBufferSource(),
              g = this.ctx.createGain();
            o.buffer = buf;
            o.playbackRate.value = 2 ** ((n - root) / 12);
            this.wobble.connect(o.detune);
            if (b) Object.assign(o, { loop: true, loopStart: a / 11025, loopEnd: b / 11025 });
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vel, t + attack);
            g.gain.setTargetAtTime(0, t + dur, tail);
            if (lp) {
              const f = this.ctx.createBiquadFilter();
              f.type = "lowpass";
              f.frequency.value = lp;
              f.Q.value = 0;
              o.connect(f).connect(g);
            } else o.connect(g);
            g.connect(this.tone);
            o.start(t);
            o.stop(t + dur + tail * 8);
            return true;
          }
          gaita(n, t, dur, vel) {
            // a recorded bagpipe chanter (FreePats' Bagpipe, CC0), or the synthesized pipes without samples
            if (!this.sample("gaita", n, t, dur, vel * GAITA, 0.02, 0.06)) this.pipes(n, t, dur, vel);
          }
          grand(n, t, dur, vel) {
            // a recorded grand piano, played softly (VCSL's Kawai, CC0): each note rings to its own end
            // whatever its length, through a gentle low-pass; the felt piano without samples
            if (!this.sample("grand", n, t, 2.2, vel * GRAND, 0.004, 0.3, 1600)) this.felt(n, t, dur, vel);
          }
          spanish(n, t, dur, vel) {
            // a recorded Spanish classical guitar (FreePats, CC0) ringing a little past its note, or the nylon
            if (!this.sample("spanish", n, t, dur + 0.4, vel * SPANISH, 0.003, 0.15))
              this.nylon(n, t, dur, vel);
          }
          piano(n, t, dur, vel) {
            this.fm(n, t, dur, vel * 1.3, 1, 3.5, 0.2); // a piano's low notes, struck hard
          }
          gong(t, vel) {
            // a gong: a low tone with an out-of-tune partial, ringing long over a wash of noise
            this.ping(98, t, 2.5, 0.3 * vel);
            this.ping(98 * 2.76, t, 1.5, 0.1 * vel);
            this.hit(t, 1.8, "bandpass", 1200, 0.12 * vel, 0.01);
          }
          bombo(t, vel) {
            // the bass drum of a gaita band, hit with a mallet: rounder and shorter than the big drum
            this.thump(t, 100, 55, 0.08, 0.5 * vel, 0.35);
            this.hit(t, 0.03, "lowpass", 600, 0.15 * vel);
          }
          bigdrum(t, vel) {
            this.thump(t, 85, 38, 0.25, 0.8 * vel, 0.9);
            this.hit(t, 0.25, "lowpass", 300, 0.35 * vel);
          }
        }
        // The whole song as a list of voice calls, [name, ...arguments] with times from the song's start, for
        // a player outside Web Audio (the Android app's native engine, native/lofi.c): play() runs
        // as it does live, but each voice it calls is written down instead of played.
        function score(sheet, nf = {}) {
          const rec = Object.create(Player.prototype),
            out = [];
          for (const name of Object.getOwnPropertyNames(Player.prototype))
            if (!["constructor", "play", "schedule"].includes(name))
              rec[name] = (...args) => out.push([name, ...args.map(Number)]);
          Object.assign(rec, {
            s: sheet,
            loop: LOOPS[sheet.loop] || LOOPS.lazy,
            sd: 60 / sheet.bpm / 4,
            nf,
            cur: 0,
          });
          Object.assign(rec, { step: 0, start: 0, stopAt: Infinity });
          rec.schedule(Infinity);
          return out;
        }
        return {
          song,
          score,
          breathe,
          phaserRate,
          sampleLines,
          reverbIR,
          regionOf,
          Player,
          BANDS,
          KITS,
          STYLES,
          REGIONS,
          OWN_REGIONS,
        };
      })();

<script>
"use strict";
/*
 * Night Drive: a car drives itself between real cities. The road is an OutRun-style "superscaler":
 * a road made of segments projected one by one, its curves and hills pure functions of the segment
 * number, so the road never ends and needs no data. Sky and light follow the device clock.
 * The player steers (pedal, signals, stop, next city, camera), the driver does the rest.
 * Storage: localStorage "drive.opus.v1" = { leg, km, mute }.
 */
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 320, H = 180;
// the canvas fills the window: 180 pixels high on a 16:9 screen (320 x 180), wider or taller to match other windows
function fit() {
  const ar = clamp(innerWidth / innerHeight, 0.45, 2.6);
  H = ar >= 1 ? 180 : Math.round(180 / ar * 0.6); W = Math.round(H * ar);
  cv.width = W; cv.height = H;
}
addEventListener("resize", () => fit());

// ---- tiny helpers ----
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const hash = (n) => { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = (c, k = 1) => `rgb(${c[0] * k | 0},${c[1] * k | 0},${c[2] * k | 0})`;
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
fit();

// ---- the route: real cities and the road distances between them (km) ----
const CITIES = [
  ["Lisboa", 0, "field"], ["Madrid", 625, "field"], ["Valencia", 355, "field"], ["Barcelona", 350, "coast"],
  ["Marseille", 505, "field"], ["Nice", 200, "coast"], ["Genova", 190, "coast"], ["Milano", 145, "field"],
  ["Lyon", 440, "field"], ["Bordeaux", 555, "field"], ["San Sebastián", 235, "coast"], ["Lisboa", 0, "field"],

  rect(px, py - 47 + breath, 10, 4, "#3a1830");
  for (let i = 0; i < 6; i++) { const wav = Math.sin(now / 400 + i) * 1.5; rect(px - 1 - i * 1.6, py - 46 + i * 2 + breath + wav, 3, 2, "#3a1830"); }
  rect(px + 6, py - 41 + breath, 1, 1, "#20142a");
  rect(px + 9, py - 30 + breath, 8, 3, "#e8e0f0"); // arm folded, a can in hand
  rect(px + 16, py - 33 + breath, 3, 5, "#ff4fae");
}

// ---- the world moving ----
let rain = rainNow(), L = light(), last = performance.now(), kmAcc = 0;
function step(dt) {
  now += dt * 1000;
  // the driver keeps distance from the car ahead and overtakes it on their own, signalling first
  let want = stopped ? 0 : target;
  for (const c of traffic) {
    c.z += c.v / 3.6 * dt / (SEG / 2) * SEG / 2;
    const gap = c.z - pos;
    if (gap < -20) { c.z = pos + 250 + Math.random() * 150; c.lane = Math.floor(Math.random() * 3); c.v = 60 + Math.random() * 50; }
    if (gap > 450) c.z = pos + 200 + Math.random() * 100;
    if (Math.abs(c.lane - laneX) < 0.6 && gap > 0 && gap < 30) {
      want = Math.min(want, c.v * clamp((gap - 6) / 20, 0, 1.2));
      if (!signal && !stopped && gap < 22 && hash(Math.floor(now / 4000)) < 0.5) {
        const free = (l) => l >= 0 && l < 3 && !traffic.some((o) => o.lane === l && Math.abs(o.z - pos) < 18);
        const dir = free(lane - 1) ? -1 : free(lane + 1) ? 1 : 0;
        if (dir) startSignal(dir);
      }
    }
  }
  speed = lerp(speed, want, 1 - Math.exp(-dt * (want < speed ? 1.2 : 0.4)));
  if (stopped && speed < 3 && !outside) outside = 1;
  pos += speed / 3.6 * dt;
  if (signal) { signalT += dt; if (signalT > 1.6 && lane === Math.round(laneX)) { const nl = clamp(lane + signal, 0, 2); lane = nl; } if (Math.abs(laneX - lane) < 0.02 && signalT > 2.2) { signal = 0; } }
  laneX = lerp(laneX, lane, 1 - Math.exp(-dt * 1.4));
  // kilometres: the real distance, at the real speed
  S.km += speed / 3600 * dt;
  if (S.km >= legKm()) arrive();
  if ((kmAcc += dt) > 5) { kmAcc = 0; save(); L = light(); rain = rainNow(); }
  // cameras change when nobody has touched it for a while
  if (performance.now() - lastTouch > 25000 && (camT += dt) > 45) { camT = 0; cam = (cam + 1) % CAMS.length; }
}
function arrive() {
  toast("Welcome to " + CITIES[S.leg][0]);
  S.leg = S.leg + 1 >= CITIES.length - 1 ? 1 : S.leg + 1; S.km = 0; save();
}
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  step(dt);
  if (outside) drawOutside(L);
  else {
    const view = CAMS[cam], hor = Math.round(H * (view === "cockpit" ? 0.45 : view === "high" ? 0.3 : 0.42));
    const sh = (pos / SEG) * 0.0 + curveAt(Math.floor(pos / SEG)) * 30 + pos * 0.02 * Math.sin(pos / 900);
    drawSky(L, hor, sh);
    const camX = (laneX - 1) * 0.66;
    drawRoad(L, hor, view === "cockpit" ? camX + 0.08 : camX * 0.6);
    if (view === "cockpit") drawCockpit(L, hor);
    else { const s = Math.min(W, H * 1.4) * (view === "high" ? 0.4 : 0.55); carRear(W / 2 + (camX * 0.4) * W * 0.3, H * (view === "high" ? 0.78 : 0.88), s, [210, 40, 90], L, true); drawRain(L); }
  }
  hud();
  if (audio) tickMusic();
  requestAnimationFrame(frame);
}

// ---- HUD (only while awake) ----
const $ = (id) => document.getElementById(id);
function hud() {
  if (!document.body.classList.contains("awake")) return;
  if (performance.now() - lastTouch > 6000) { document.body.classList.remove("awake"); return; }
  const d = new Date(), left = Math.max(0, legKm() - S.km), eta = speed > 5 ? new Date(Date.now() + left / speed * 3600e3) : null;
  const hm = (x) => String(x.getHours()).padStart(2, "0") + ":" + String(x.getMinutes()).padStart(2, "0");
  $("clock").textContent = hm(d) + (rain ? "  rain" : "");
  $("spd").textContent = Math.round(speed);
  $("route").textContent = CITIES[S.leg - 1][0] + " → " + CITIES[S.leg][0];
  $("left").textContent = left.toFixed(1) + " km left" + (eta ? "  ·  arrive " + hm(eta) : "");
  $("bStop").textContent = stopped ? "DRIVE" : "STOP";
  $("bL").classList.toggle("on", signal < 0); $("bR").classList.toggle("on", signal > 0);
}
let toastT;
function toast(s) { const e = $("toast"); e.textContent = s; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("show"), 2200); }

// ---- sound: the lo-fi generator, plus the indicator's tick ----
let audio = null, bus, songs = [], songK = 0;
function startAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  bus = audio.createGain(); bus.gain.value = S.mute ? 0 : 0.8; bus.connect(audio.destination);
  nextSong(3);
}
function nextSong(fade) {
  const L = light(), d = new Date();
  const mood = { night: clamp(1 - L.day, 0, 1), rain: rain ? 0.6 : 0, wind: 0.35, crowd: 0.15, places: true };
  // every other song uses LOFI's own "techno" style (pads, a sequencer riff, four on the floor): the synthwave side of the drive
  if (songK % 2 === 0) mood.region = "techno";
  const sheet = LOFI.song((hashStr(CITIES[S.leg][0] + d.toDateString() + d.getHours()) + songK++ * 7919) >>> 0, mood);
  const t = audio.currentTime;
  for (const o of songs) if (o.stopAt > t + fade) o.fadeOut(t, fade);
  songs.push(new LOFI.Player(audio, bus, sheet, t + 0.1, fade, { drift: true, breathe: true, swell: true, phaser: true }));
}
function hashStr(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function tickMusic() {
  const t = audio.currentTime;
  if (t > songs.at(-1).end - 8) nextSong(8);
  for (const o of songs) o.schedule(t + 1.5);
  songs = songs.filter((o) => t < o.stopAt + 2 || o.dispose());
}
function click(f) {
  if (!audio || S.mute) return;
  const o = audio.createOscillator(), v = audio.createGain(), t = audio.currentTime;
  o.type = "square"; o.frequency.value = f; v.gain.setValueAtTime(0.05, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(v).connect(audio.destination); o.start(t); o.stop(t + 0.05);
}
setInterval(() => { if (signal && !outside) click(Math.floor(now / 350) % 2 ? 1800 : 1200); }, 350);

// ---- steering ----
function startSignal(dir) { if (stopped) return; signal = dir; signalT = 0; }
function wake() {
  lastTouch = performance.now(); camT = 0; document.body.classList.add("awake"); $("hint").style.display = "none";
  startAudio(); if (audio && audio.state === "suspended") audio.resume();
}
document.addEventListener("pointerdown", wake);
const on = (id, f) => $(id).addEventListener("click", (e) => { e.stopPropagation(); wake(); f(); });
on("bL", () => { startSignal(-1); toast(lane === 0 ? "Already in the left lane" : "Signalling left"); });
on("bR", () => { startSignal(1); toast(lane === 2 ? "Already in the right lane" : "Signalling right"); });
on("bFast", () => { target = clamp(target + 15, 50, 160); toast("Cruising at " + target + " km/h"); });
on("bSlow", () => { target = clamp(target - 15, 50, 160); toast("Cruising at " + target + " km/h"); });
on("bStop", () => {
  if (stopped) { stopped = false; outside = 0; toast("Back on the road"); }
  else { stopped = true; signal = 0; lane = 2; toast("Pulling over…"); }
});
on("bRoute", () => {
  S.leg = S.leg + 1 >= CITIES.length - 1 ? 1 : S.leg + 1; S.km = 0; save();
  toast("New route: " + CITIES[S.leg - 1][0] + " → " + CITIES[S.leg][0] + ", " + legKm() + " km");
});
on("bCam", () => { if (!outside) { cam = (cam + 1) % CAMS.length; toast("Camera: " + CAMS[cam]); } });
on("bMute", () => {
  S.mute = !S.mute; save(); if (bus) bus.gain.setTargetAtTime(S.mute ? 0 : 0.8, audio.currentTime, 0.1);
  $("bMute").textContent = S.mute ? "♪ OFF" : "♪ ON"; toast(S.mute ? "Music off" : "Music on");
});
$("bMute").textContent = S.mute ? "♪ OFF" : "♪ ON";
speed = 80;
requestAnimationFrame(frame);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
