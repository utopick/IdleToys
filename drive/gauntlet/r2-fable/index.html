<!--
  Night Courier: a Drive gauntlet entry (r2, fable). One file: the scene, the cockpit and the sound.
  Storage keys: drive.save (the trip, versioned with v), drive.wx (the last weather answer).
  Reused from our own Clockscapes: the whole <script id="lofi"> music generator and sunPos().
  Credits: weather by Open-Meteo (CC BY 4.0). City positions and road distances are typed by hand.
-->

body.idle{cursor:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}

       * new LOFI.Player(ctx, destination, sheet, start, fadeIn, nf) plays one sheet through Web Audio; the caller

       *   or all false) a song plays its plain score, which a test pins with a fingerprint.
       * The first drum loop, its bass rhythm and the chord hits are TUNE.Pocket's JAM "Lo-fi" loop (lazy beat).
       * Each song picks a band from BANDS, which says which Player voice plays the chords, the lead (one of
       *   its leads, another one plays the solo section) and the bass, which drum kit plays the loop (KITS maps
       *   each drum row to a voice), and how much echo the chords and leads get. The sheet keeps that choice in
       *   band, voices, drums, hits and echo, so the Player only follows the sheet.
       * Each song grows from a gene of three moves between scale degrees (sheet.motif). The moves walk the
       *   melody inside a bar, the four chords of a section (sheet.chords), and B away from A (sheet.chordsB
       *   starts on A's second chord), so the song has the same shape at every size. Each melody bar also
       *   turns on where the last one ended. A chord colour (COLOURS), the tempo and the order of the
       *   sections (FORMS) also come from the seed.

       *   ending, and every song has a four-bar solo. Some songs add a ticking clock (CLICKS) under the drums.
       * To add a band, add a row to BANDS and, if it needs a new sound, write that voice as a Player method

       *   (chords and leads, which get the echo) or this.bus (bass and drums). Give it at least two leads. Then
       *   render a song with it and set its level so it sounds about as loud as the others; the test checks
       *   that every band turns up and that every voice it names exists.
       * Regional music: mood.region names a style (STYLES), which bends the song towards a place: its scale,
       *   its chords, its tempo, its band, and parts of its own (a drone, a strummed chord, hand drums, grace
       *   notes, an ostinato) that the sheet carries and the Player plays. regionOf(country, city) finds a

       *   song is the same plain lo-fi song as ever. song(seed, { kaiju: true }) is the march for a monster.
       * This script stands alone (it uses nothing from the main script), so it can be copied into another

        // The style of a place: its region's, else its country's, else "" (plain lo-fi).
        function regionOf(country, city) {
          for (const [style, cities] of [...Object.values(OWN_REGIONS), ...Object.values(REGIONS)])
            if (cities?.split(" ").includes(city)) return style;
          return REGIONS[country]?.[0] || "";
        }
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        function rngFrom(seed) {
          let a = seed >>> 0;
          return () => {
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function song(seed, mood = {}) {
          const r = rngFrom(seed),
            pick = (a) => a[Math.floor(r() * a.length)];
          const night = clamp(+mood.night || 0, 0, 1),
            rain = clamp(+mood.rain || 0, 0, 1);
          // a regional style (or the kaiju's) bends the song; the dice are thrown the same either way, so
          // without one the song is exactly the plain lo-fi one
          const styleName = mood.kaiju ? "kaiju" : STYLES[mood.region] ? mood.region : "",
            style = STYLES[styleName],
            modeName = style?.modes?.[(seed >>> 0) % style.modes.length],
            mode = MODES[modeName];
          const minorRoll = r() < 0.25 + 0.5 * night,
            minor = mode ? mode.minor : minorRoll,
            scale = mode ? mode.scale : minor ? MINOR : MAJOR,
            keyRoll = Math.floor(r() * 12),
            key = style?.key ?? keyRoll;
          const tone = (k) => key + scale[k % 7] + 12 * Math.floor(k / 7);
          // a tranquil lo-fi tempo: 62 to 74 at night, up to 80 by day (the owner found 58 to 95 too uppity)
          let bpm = Math.round(62 + r() * 12 + 6 * (1 - night));
          if (style?.bpm) bpm = style.bpm[0] + (bpm % (style.bpm[1] - style.bpm[0] + 1));
          const motif = [pick(MOVES), pick(MOVES), pick(MOVES)];
          let colourName = pick(Object.keys(COLOURS)),
            colour = COLOURS[colourName];
          if (style?.colour)
            [colourName, colour] = Array.isArray(style.colour)
              ? ["own", style.colour]

          // chord with a diminished fifth)

  if (stopped && speed < 2) { // the driver, leaning on the door with a coffee
    const u = L / 60, x = cx + L * 0.44, y = cy - u, sk = css(mix([236, 178, 140], P.top, night * 0.42));
    R(x, y - 12 * u, 2.2 * u, 12 * u, "#141024"); R(x + 3 * u, y - 12 * u, 2.2 * u, 11 * u, "#141024"); R(x + 3 * u, y - u, 4 * u, u, "#e8e0d0");
    R(x - 0.5 * u, y - 21 * u, 6 * u, 10 * u, css(mix([40, 70, 130], P.top, night * 0.45))); R(x - 0.5 * u, y - 15 * u, 6 * u, u, css(mix([255, 122, 60], P.top, night * 0.3)));
    R(x + 1 * u, y - 25.5 * u, 4 * u, 4.5 * u, sk); R(x + 0.4 * u, y - 26.5 * u, 5 * u, 2 * u, "#3a1438"); R(x + 0.4 * u, y - 25 * u, 1.4 * u, 4 * u, "#3a1438");
    R(x + 5 * u, y - 19 * u, 4 * u, 1.6 * u, css(mix([40, 70, 130], P.top, night * 0.45))); R(x + 8.6 * u, y - 20.6 * u, 1.8 * u, 2.6 * u, "#f0ece0");
    for (let k = 0; k < 3; k++) { const a = (time * 0.5 + k / 3) % 1; R(x + 9.2 * u + Math.sin(time * 2 + k) * u, y - 21 * u - a * 7 * u, 1, 1, css([255, 255, 255], 0.5 * (1 - a))); }
  }
  rain(0, H, false);
}
function fog() { if (WX.fog) R(0, 0, W, H, css(mix([170, 175, 190], P.top, night * 0.8), 0.45)); }
function draw() {
  palette();
  g.imageSmoothingEnabled = false;
  if (stopped || cam === 2) { side(); fog(); return; }
  if (cam === 0) { HY = Math.round(H * 0.4); BASE = H * 0.66; WS = 1.15; sky(HY); far(HY, head * 120); road(); scenery(); fog(); cockpit(); }
  else {
    HY = Math.round(H * 0.46); BASE = H; WS = 0.85; sky(HY); far(HY, head * 120); road(); scenery();
    const w = Math.min(W * 0.36, H * 0.3), cx = W / 2 + (lane - laneX) * -w * 0.3 + curve * w * 0.1, cy = H * 0.93;
    g.globalCompositeOperation = "lighter"; poly([[cx - w * 0.4, cy - w * 0.4], [cx + w * 0.4, cy - w * 0.4], [cx + w * 1.1, HY + (H - HY) * 0.25], [cx - w * 1.1, HY + (H - HY) * 0.25]], css([255, 235, 180], 0.1 * night)); g.globalCompositeOperation = "source-over";
    rearCar(cx, cy, w, P.car, true);
    if (ind && indT % 0.7 < 0.35) { R(cx + ind * w * 0.44 - 2, cy - w * 0.27, 4, 3, "#ffb030"); glow(cx + ind * w * 0.44, cy - w * 0.26, 10, [255, 170, 40], 0.7); }
    rain(0, H, false); fog();
  }
}

/* ---------- sound: the radio (Clockscapes LOFI), the engine, the indicator ---------- */
let AC = null, master, musicBus, eng, songs = [], seed = (Date.now() / 1000) | 0, tickOn = false;
function region() {
  if (!S.radio) return night > 0.5 ? "techno" : "soul"; // the mixtape follows the hour
  return pos.lon < -7.2 ? (pos.lat > 41.9 ? "galicia" : "fado") : pos.lat > 42.9 ? "celtic" : "flamenco"; // the local station
}
function nextSong(fade) {
  const now = AC.currentTime;
  for (const o of songs) if (o.stopAt > now + fade) o.fadeOut(now, fade);
  try {
    const sheet = LOFI.song(seed++, { night, rain: WX.rain, thunder: false, places: false, region: region() });
    songs.push(new LOFI.Player(AC, musicBus, sheet, now + 0.1, fade));
  } catch (e) { console.warn("radio", e); }
}
function audioStart() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = S.mute ? 0 : 1; master.connect(AC.destination);
  musicBus = AC.createGain(); musicBus.gain.value = 0.9; musicBus.connect(master);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 160;
  const eg = AC.createGain(); eg.gain.value = 0.05; lp.connect(eg); eg.connect(master);
  eng = [1, 1.5].map((m) => { const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = 40 * m; o.connect(lp); o.start(); o.m = m; return o; });
  nextSong(3);
  setInterval(() => {
    const now = AC.currentTime;
    if (!songs.length || now > songs.at(-1).end - 8) nextSong(8);
    for (const s of songs) s.schedule(now + 3);
    songs = songs.filter((s) => now < s.stopAt + 2 || s.dispose());
    for (const o of eng) o.frequency.setTargetAtTime((34 + speed * 0.28) * o.m, now, 0.3);
    if (ind && !S.mute) { const o = AC.createOscillator(), a = AC.createGain(); o.type = "square"; o.frequency.value = tickOn ? 900 : 700; tickOn = !tickOn; a.gain.setValueAtTime(0.03, now); a.gain.exponentialRampToValueAtTime(0.001, now + 0.04); o.connect(a); a.connect(master); o.start(now); o.stop(now + 0.05); }
  }, 350);
}

/* ---------- the HUD: fades in on a touch, fades out again ---------- */
let hudT = 0;
const fmtH = (h) => (h >= 1 ? Math.floor(h) + " h " : "") + Math.round((h % 1) * 60) + " min";
function hud() {
  const [kmh, x] = PACES[S.pace], left = TR.total - S.km, info = $("info");
  info.textContent = "";
  const b = document.createElement("b"); b.textContent = N[S.from][0] + " → " + N[S.to][0];
  const s = document.createElement("span");
  s.textContent = stopped
    ? arrived ? T("Delivered: ", "Entregado: ") + T(...PACKS[S.pack]) + "." : T("A short stop. Coffee, and the road going by.", "Una parada corta. Café, y la carretera pasando.")
    : T("Carrying ", "Llevas ") + T(...PACKS[S.pack]) + ". " + Math.round(speed) + " km/h" + (x > 1 ? " ×" + x : "") + ", " + pos.next + " " + Math.ceil(pos.toNext) + " km, " + T("in all ", "en total ") + Math.ceil(left) + " km, " + fmtH(left / (kmh * x)) + ".";
  info.append(b, document.createElement("br"), s);
  $("bStop").textContent = stopped ? T("GO", "SEGUIR") : T("STOP", "PARAR");
  $("bRadio").textContent = S.radio ? T("LOCAL FM", "FM LOCAL") : T("MIXTAPE", "CINTA");
  $("bMute").textContent = S.mute ? T("SOUND OFF", "SIN SONIDO") : T("SOUND ON", "CON SONIDO");
  $("bL").classList.toggle("lit", ind === -1); $("bR").classList.toggle("lit", ind === 1);
}
function touch() { hudT = 6; $("hud").classList.add("on"); document.body.classList.remove("idle"); if (!stopped && cam) { cam = 0; } camT = 0; hud(); }
const ACT = {
  bL: () => signal(-1), bR: () => signal(1),
  bSlow: () => { S.pace = Math.max(0, S.pace - 1); }, bFast: () => { S.pace = Math.min(PACES.length - 1, S.pace + 1); },
  bStop: () => (stopped ? go() : stopNow(0)),
  bRadio: () => { S.radio = S.radio ? 0 : 1; if (AC) nextSong(1.5); },
  bMute: () => { S.mute = !S.mute; if (AC) master.gain.setTargetAtTime(S.mute ? 0 : 1, AC.currentTime, 0.05); },
};
const TITLES = { bL: ["Indicate left", "Intermitente izquierdo"], bR: ["Indicate right (again in the right lane: pull in)", "Intermitente derecho (otra vez en el carril derecho: parar)"], bSlow: ["Slower", "Más despacio"], bFast: ["Faster, then shorten the trip", "Más rápido, y luego acortar el viaje"], bStop: ["Stop or go on", "Parar o seguir"], bRadio: ["Radio: mixtape or local station", "Radio: cinta o emisora local"], bMute: ["Sound", "Sonido"] };
for (const id in ACT) { $(id).title = T(...TITLES[id]); $(id).setAttribute("aria-label", T(...TITLES[id])); $(id).addEventListener("click", () => { ACT[id](); save(); touch(); }); }
addEventListener("pointerdown", touch);
addEventListener("pointerup", audioStart); addEventListener("click", audioStart); // sound needs a finished tap

addEventListener("keydown", (e) => {
  const k = { ArrowLeft: "bL", ArrowRight: "bR", ArrowDown: "bSlow", ArrowUp: "bFast", " ": "bStop", r: "bRadio", m: "bMute" }[e.key];
  if (k) { e.preventDefault(); ACT[k](); save(); }
  audioStart(); touch();
});
addEventListener("contextmenu", (e) => e.preventDefault());

/* ---------- the loop ---------- */
let last = performance.now(), hudTick = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt); draw();
  if (hudT > 0) { hudT -= dt; hudTick += dt; if (hudTick > 0.5) { hudTick = 0; hud(); } if (hudT <= 0) { $("hud").classList.remove("on"); document.body.classList.add("idle"); } }
  requestAnimationFrame(frame);
}
palette(); weather(); setInterval(weather, 12e5); setInterval(save, 1e4); addEventListener("pagehide", save);
requestAnimationFrame(frame);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
